name: tests

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ingest/requirements.txt
      - name: python tests
        run: python -m unittest discover -s ingest/tests -t . -v
        env:
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_KEY: sb_secret_test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: frontend tests
        run: node --test "tests/*.test.js"
