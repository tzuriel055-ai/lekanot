<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בקטנה — פשוט לקנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{
    --bg:#F6F9F9; --surface:#FFFFFF;
    --ink:#15312F; --ink-dim:#6E8584; --ink-faint:#9FB2B1;
    --accent:#0E575A; --accent-soft:rgba(14,87,90,0.08);
    --gold:#B99750; --danger:#C24B3F;
    --neutral-highlight:#EEF1F0;
    --glass-strong:rgba(255,255,255,0.72); --glass-light:rgba(255,255,255,0.42); --glass-border:rgba(255,255,255,0.55);
    --radius-sq:20px; --radius-sq-sm:14px; --radius-pill:999px;
    --shadow-card:0 1px 14px rgba(14,87,90,0.09);
    --shadow-float:0 8px 30px rgba(14,87,90,0.2);
    --header-h:150px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:'Heebo',sans-serif;color:var(--ink);background:var(--bg);min-height:100%;padding-bottom:env(safe-area-inset-bottom,0px);}
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif;font-weight:700;margin:0;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  input,select,textarea{font-family:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:calc(var(--header-h) + 10px) 16px 150px;}

  /* ===== מסך טעינה ראשוני ===== */
  #loader{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s ease;}
  #loader.hide{opacity:0;pointer-events:none;}
  #loader img{width:150px;height:auto;animation:pulse 1.5s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.07);}}
  .loader-dots{display:flex;gap:8px;}
  .loader-dots span{width:8px;height:8px;border-radius:50%;background:var(--accent-soft);animation:dotbounce 1.2s ease-in-out infinite;}
  .loader-dots span:nth-child(2){animation-delay:.15s;} .loader-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotbounce{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-6px);background:var(--accent);}}

  /* ===== מסך "מחשב השוואה" - אוברליי זכוכית זמני ===== */
  #computeOverlay{position:fixed;inset:0;background:rgba(246,249,249,0.55);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
    z-index:85;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
  #computeOverlay.show{display:flex;}
  #computeOverlay img{width:90px;animation:pulse 1.3s ease-in-out infinite;}
  #computeOverlay span{font-size:13px;color:var(--ink-dim);}

  /* ===== סרגל עליון - קבוע, זכוכית חלבית, בכל העמודים ===== */
  header.top{position:fixed;top:0;left:0;right:0;z-index:40;padding:14px 16px 10px;
    background:var(--glass-strong);backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);
    border-bottom:1px solid var(--glass-border);}
  .header-inner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:760px;margin:0 auto;}
  .brand-row{order:1;display:flex;align-items:center;gap:9px;cursor:pointer;overflow:hidden;transition:max-height .28s ease,opacity .22s ease,margin .28s ease;max-height:50px;opacity:1;}
  .brand-row img{width:36px;height:auto;flex-shrink:0;}
  .brand-row .brand-text{display:flex;flex-direction:column;line-height:1.2;}
  .brand-row .brand-text b{font-size:17px;color:var(--ink);}
  .brand-row .brand-text span{font-size:10px;color:var(--ink-dim);}
  .header-actions{order:2;margin-inline-start:auto;display:flex;align-items:center;gap:8px;overflow:hidden;transition:max-height .28s ease,opacity .22s ease;max-height:50px;opacity:1;}
  .sync-label{font-size:9px;color:var(--ink-faint);text-align:center;line-height:1.3;max-width:50px;}
  .avatar-btn{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .bell-btn{width:34px;height:34px;border-radius:50%;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

  .search-row{order:3;flex:1 1 100%;}
  .search-bubble{background:var(--glass-light);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--glass-border);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);
    padding:5px 7px;display:flex;align-items:center;gap:8px;}
  .search-bubble input{flex:1;border:none;outline:none;background:transparent;color:var(--ink);font-size:15px;padding:11px 10px;}
  .search-bubble input::placeholder{color:var(--ink-faint);}
  .search-bubble .icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:16px;}
  .search-bubble select{background:transparent;border:none;outline:none;color:var(--ink-dim);font-size:11px;max-width:84px;cursor:pointer;padding:0 4px;}

  .chips{order:4;flex:1 1 100%;display:flex;gap:7px;overflow-x:auto;padding:2px 2px 0;scrollbar-width:none;transition:max-height .28s ease,opacity .22s ease;max-height:50px;opacity:1;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;color:var(--ink-dim);cursor:pointer;user-select:none;}
  .chip.active{background:var(--neutral-highlight);color:var(--ink);font-weight:500;}

  /* בכל רוחב מסך: בגלילה, הקטגוריות תמיד נעלמות מתחת לחיפוש */
  header.top.collapsed .chips{max-height:0;opacity:0;margin:0;pointer-events:none;}

  /* מסכים לא רחבים (כולל חצי-מחשב): גם המותג+פעולות נעלמים, והחיפוש מתנתק
     לבועה צפה - בדיוק כמו הסרגל התחתון, לא נשאר דבוק לרוחב מלא למעלה */
  @media (max-width:1099px){
    header.top.collapsed .brand-row,header.top.collapsed .header-actions{max-height:0;opacity:0;margin:0;pointer-events:none;}
    header.top.collapsed .search-row{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(92vw,480px);z-index:50;}
    header.top.collapsed .search-bubble{background:var(--glass-strong);box-shadow:var(--shadow-float);}
    /* חייב, אחרת נשאר פס זכוכית ריק דבוק למעלה - התוכן היחיד שנשאר (החיפוש)
       כבר התנתק לבועה צפה משלו, אז המעטפת של ההדר עצמו צריכה להיעלם */
    header.top.collapsed{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:none;box-shadow:none;padding-bottom:0;}
  }
  @media (min-width:760px){
    .brand-row img{width:42px;}
    .brand-row .brand-text b{font-size:19px;}
    .search-row{order:2;flex:1 1 auto;min-width:220px;}
    .header-actions{order:3;}
    .chips{order:4;}
  }
  @media (min-width:1100px){
    .header-inner{max-width:1000px;}
    .wrap{max-width:1400px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;}
    .navbar{padding:10px 16px;gap:8px;}
    .navbar button{padding:11px 24px;font-size:22px;}
    .navbar button .lbl{font-size:11.5px;}
  }

  /* ===== דרופדאון חיפוש (כשפותחים חיפוש בזמן שעמוד אחר פתוח) ===== */
  .search-dropdown{position:fixed;top:var(--header-h);left:0;right:0;z-index:44;max-height:60vh;overflow-y:auto;
    background:var(--glass-strong);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);
    padding:14px 16px 20px;display:none;box-shadow:var(--shadow-float);}
  .search-dropdown.show{display:block;}
  .search-dropdown .inner{max-width:760px;margin:0 auto;}

  /* ===== גריד מוצרים ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px;margin-top:4px;}
  .card{background:var(--surface);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);padding:12px;display:flex;flex-direction:column;gap:6px;transition:transform .15s ease;}
  .card:active{transform:scale(0.97);}
  .card .thumb{aspect-ratio:1/1;border-radius:var(--radius-sq-sm);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);background:var(--accent-soft);overflow:hidden;}
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .name{font-size:13px;line-height:1.35;min-height:35px;color:var(--ink);}
  .card .price-line{font-size:13px;color:var(--accent);font-weight:500;display:flex;align-items:baseline;gap:4px;}
  .card .price-line .unit{font-size:10px;color:var(--ink-faint);font-weight:400;}
  .card .price-line .lbl{font-size:9px;color:var(--ink-faint);font-weight:400;}
  .card .bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .stepper{display:flex;align-items:center;gap:6px;background:var(--neutral-highlight);border-radius:var(--radius-pill);padding:4px 5px;}
  .stepper button{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-dim);}
  .stepper .numcol{display:flex;flex-direction:column;align-items:center;line-height:1;min-width:16px;}
  .stepper .numcol .n{font-size:12px;color:var(--ink);}
  .stepper .numcol .unit{font-size:7px;color:var(--ink-faint);margin-top:1px;}
  .add-circle{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:transform .35s ease;}
  .add-circle.spin{transform:rotate(180deg);}
  .empty,.loading{color:var(--ink-dim);text-align:center;padding:60px 10px;font-size:14px;}

  /* ===== סרגל תחתון ===== */
  .navbar{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    display:flex;gap:2px;background:var(--glass-strong);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
    border:1px solid var(--glass-border);border-radius:var(--radius-pill);box-shadow:var(--shadow-float);padding:7px;z-index:60;}
  .navbar button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 14px;border-radius:var(--radius-pill);color:var(--ink-faint);font-size:18px;transition:transform .18s ease,background .18s ease;}
  .navbar button .lbl{font-size:9.5px;}
  .navbar button.active{background:rgba(255,255,255,0.8);color:var(--ink);transform:scale(1.08);}
  .navbar .badge{position:absolute;top:1px;left:4px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

  .compare-glow-wrap{position:relative;display:flex;justify-content:center;margin-top:18px;padding-top:14px;}
  .compare-glow-wrap::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:70%;height:36px;
    background:radial-gradient(ellipse at center, rgba(14,87,90,0.22), transparent 72%);filter:blur(10px);pointer-events:none;}
  .btn-compare{position:relative;background:var(--glass-strong);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border:1px solid var(--glass-border);color:var(--ink);border-radius:var(--radius-pill);box-shadow:var(--shadow-float);
    padding:13px 30px;font-size:13.5px;font-weight:500;}

  /* ===== תת-סרגל תוצאות - דבוק מעל הסרגל התחתון הרגיל ===== */
  .results-subnav{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);
    display:flex;gap:4px;background:var(--glass-strong);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
    border:1px solid var(--glass-border);border-radius:var(--radius-pill);box-shadow:var(--shadow-float);padding:6px;z-index:59;
    opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;}
  .results-subnav.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}
  .results-subnav button{padding:9px 16px;border-radius:var(--radius-pill);font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:5px;}
  .results-subnav button.active{background:rgba(255,255,255,0.85);color:var(--ink);font-weight:500;}

  .results-grid{display:flex;flex-direction:column;gap:16px;}
  @media (min-width:900px){.results-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start;}}

  .compare-table{width:100%;border-collapse:collapse;font-size:12px;background:var(--surface);border-radius:var(--radius-sq);overflow:hidden;box-shadow:var(--shadow-card);}
  .compare-table th,.compare-table td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--neutral-highlight);}
  .compare-table th{background:var(--neutral-highlight);font-weight:500;font-size:11px;}
  .compare-table td:first-child,.compare-table th:first-child{text-align:right;font-size:12px;}
  .compare-table .na{color:var(--ink-faint);}
  .table-wrap{overflow-x:auto;margin-top:14px;}

  /* ===== מצב קניה במסך מלא לרשימה אחת, עם מעבר בין רשימות ===== */
  .shop-switcher{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    display:flex;gap:4px;background:var(--glass-strong);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid var(--glass-border);border-radius:var(--radius-pill);box-shadow:var(--shadow-float);padding:6px;z-index:60;max-width:92vw;overflow-x:auto;}
  .shop-switcher button{padding:9px 16px;border-radius:var(--radius-pill);font-size:12px;color:var(--ink-dim);white-space:nowrap;}
  .shop-switcher button.active{background:rgba(255,255,255,0.85);color:var(--ink);font-weight:500;}
  .shop-close{position:fixed;top:14px;left:16px;z-index:60;width:36px;height:36px;border-radius:50%;background:var(--glass-strong);backdrop-filter:blur(14px);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;color:var(--ink-dim);}

  /* ===== עמודים ===== */
  .page{position:fixed;inset:0;background:var(--bg);z-index:35;overflow-y:auto;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.9,.28,1);}
  .page.open{transform:translateY(0);}
  .page-inner{max-width:760px;margin:0 auto;padding:calc(var(--header-h) + 14px) 16px 150px;}
  .page h2{font-size:18px;margin-bottom:14px;}

  /* ===== גיליון מוצר ===== */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(10,20,20,0.22);backdrop-filter:blur(2px);z-index:46;display:none;}
  .sheet-backdrop.open{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:48;max-height:88vh;overflow-y:auto;
    background:var(--glass-strong);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
    border-top:1px solid var(--glass-border);
    border-radius:28px 28px 0 0;padding:10px 0 calc(28px + env(safe-area-inset-bottom,0px));
    transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.9,.28,1);box-shadow:0 -10px 40px rgba(14,87,90,0.18);}
  .sheet.open{transform:translateY(0);}
  .sheet .grabber{width:40px;height:5px;border-radius:3px;background:rgba(14,87,90,0.18);margin:0 auto 10px;}
  .sheet-inner{max-width:760px;margin:0 auto;padding:0 18px;}

  .product-hero{display:flex;flex-direction:column;gap:12px;}
  .product-hero .img{aspect-ratio:1.8;border-radius:var(--radius-sq);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:40px;color:var(--accent);overflow:hidden;}
  .product-hero .img img{width:100%;height:100%;object-fit:cover;}
  .product-hero h1{font-size:18px;}
  .product-top-actions{display:flex;align-items:center;gap:12px;}
  @media (min-width:640px){
    .product-hero{flex-direction:row-reverse;align-items:flex-start;}
    .product-hero .img{flex:0 0 42%;aspect-ratio:1.15;}
    .product-hero .info{flex:1;}
  }
  .store-row{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.7);border-radius:var(--radius-sq-sm);padding:13px 14px;margin-bottom:8px;}
  .store-row.cheapest{background:rgba(255,255,255,0.95);box-shadow:var(--shadow-card);}
  .store-row .names{display:flex;flex-direction:column;gap:2px;}
  .store-row .names b{font-size:13px;}
  .store-row .names span{font-size:11px;color:var(--ink-dim);}
  .store-row .names .oos{color:var(--danger);font-size:11px;}
  .store-row .price-col{display:flex;align-items:center;gap:8px;}
  .store-row .price-col b{font-size:15px;color:var(--accent);}
  .store-row .price-col .unit{font-size:10px;color:var(--ink-faint);}
  .tag-cheap{font-size:10px;background:var(--accent);color:#fff;padding:3px 8px;border-radius:var(--radius-pill);}
  .stock-note{font-size:11px;color:var(--ink-faint);padding:4px 2px 14px;line-height:1.6;}
  .expand-chains{width:100%;padding:11px;border-radius:var(--radius-pill);background:rgba(255,255,255,0.6);font-size:12.5px;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;}
  .expand-chains i{transition:transform .2s ease;}
  .expand-chains.open i{transform:rotate(180deg);}

  /* ===== עגלה ===== */
  .select-bar{display:none;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius-pill);box-shadow:var(--shadow-card);padding:8px 14px;margin-bottom:12px;font-size:12.5px;color:var(--ink-dim);}
  .select-bar.show{display:flex;}
  .select-bar button{display:flex;align-items:center;gap:5px;}
  .line-item{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius-sq-sm);padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-card);}
  .check-sq{width:20px;height:20px;border-radius:7px;background:var(--neutral-highlight);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .check-sq.checked{background:var(--accent);color:#fff;}
  .line-item .thumb-sm{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);flex-shrink:0;overflow:hidden;}
  .line-item .thumb-sm img{width:100%;height:100%;object-fit:cover;}
  .line-item .name{flex:1;font-size:13px;}

  .row-actions{display:flex;gap:9px;margin:14px 0;flex-wrap:wrap;}
  .btn{flex:1;min-width:100px;padding:12px;border-radius:var(--radius-pill);background:var(--surface);box-shadow:var(--shadow-card);color:var(--ink);font-size:12.5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:none;font-weight:500;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:13px;color:var(--ink-dim);}
  .toggle-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
  .split-control{display:flex;align-items:center;gap:12px;margin:10px 0;background:var(--surface);border-radius:var(--radius-sq-sm);padding:12px 14px;box-shadow:var(--shadow-card);}
  .split-control input[type=range]{flex:1;accent-color:var(--accent);}

  /* ===== מחברת ===== */
  .notebook{background:#FFFDF8;border-radius:16px;box-shadow:0 4px 24px rgba(14,87,90,0.14);padding:26px 20px 16px;margin-bottom:18px;position:relative;overflow:hidden;}
  .notebook::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:repeating-linear-gradient(180deg,var(--gold) 0 10px,transparent 10px 20px);opacity:.5;}
  .notebook .coil{position:absolute;top:-9px;left:0;right:0;display:flex;justify-content:space-evenly;padding:0 22px;z-index:2;}
  .notebook .coil span{width:15px;height:15px;border-radius:50%;border:3px solid #AFAFAF;background:var(--bg);box-shadow:0 2px 2px rgba(0,0,0,0.15);}
  .notebook .nb-store{font-family:'Frank Ruhl Libre',serif;font-size:19px;color:var(--ink);margin-bottom:2px;}

  .split-choice{display:flex;gap:10px;margin-bottom:16px;}
  .split-choice button{flex:1;padding:14px 10px;border-radius:var(--radius-sq);background:var(--glass-light);backdrop-filter:blur(10px);border:1px solid var(--glass-border);

  .list-card .row{display:flex;justify-content:space-between;align-items:center;}

  .new-list-tile{background:var(--neutral-highlight);border-radius:var(--radius-sq);padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px;color:var(--ink-dim);}

  .deal-card{background:var(--surface);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);padding:12px;display:flex;flex-direction:column;gap:6px;}
  .deal-card .thumb{aspect-ratio:1/1;border-radius:var(--radius-sq-sm);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);background:var(--accent-soft);overflow:hidden;}
  .deal-card .thumb img{width:100%;height:100%;object-fit:cover;}
  .deal-card .name{font-size:13px;line-height:1.35;min-height:35px;color:var(--ink);}
  .deal-card .chain-meta{font-size:10px;color:var(--ink-faint);}
  .deal-card .price-row{display:flex;align-items:baseline;gap:6px;}
  .deal-card .was{font-size:11px;color:var(--ink-faint);text-decoration:line-through;}
  .deal-card .now{font-size:15px;color:var(--danger);font-weight:600;}
  .deals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:13px;}
  @media (min-width:1100px){.deals-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;}}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:6px;}
  .field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--surface);box-shadow:var(--shadow-card);border:none;border-radius:var(--radius-sq-sm);color:var(--ink);padding:12px 14px;font-size:14px;}

  .delivery-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;}
  .delivery-row input{width:76px;background:var(--neutral-highlight);border:none;border-radius:10px;color:var(--ink);padding:6px 10px;text-align:center;}

  .section-title{font-size:12px;color:var(--ink-faint);margin:20px 2px 8px;}
  .feedback-row{background:var(--surface);border-radius:var(--radius-sq-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-card);font-size:12px;}
  .feedback-row .meta{color:var(--ink-faint);font-size:10px;margin-top:5px;}

  .site-banner{background:var(--gold);color:#3c2e10;font-size:12px;text-align:center;padding:9px 14px;margin:-14px -16px 10px;}
  .site-banner.hide{display:none;}

  footer.site-footer{max-width:760px;margin:30px auto 10px;padding:0 16px;color:var(--ink-faint);font-size:11px;text-align:center;line-height:1.9;}
  footer.site-footer .flinks{display:flex;justify-content:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}

<script>
/* ======================= הגדרות חיבור ל-Supabase ======================= */
const SUPABASE_URL = "https://zkctsixcgjoymvcbiacm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0M3Fl16g6zDg9XQr319Ldw_fNUSEZ4b";

function sbHeaders(extra) {
  const h = { apikey: SUPABASE_ANON_KEY, ...extra };
  if (!SUPABASE_ANON_KEY.startsWith("sb_")) h.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
  return h;
}
async function sb(path, params = {}) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}?${qs}`, { headers: sbHeaders() });
  if (!res.ok) throw new Error(`Supabase error ${res.status}: ${await res.text()}`);
  return res.json();
}
async function sbRpc(fnName, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, { method: 'POST', headers: sbHeaders({ 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`Supabase RPC error ${res.status}: ${await res.text()}`);
  return res.json();
}
async function sbInsert(path, body) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { method: "POST", headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=representation" }), body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`Supabase insert error ${res.status}: ${await res.text()}`);
  return res.json();
}

/* ======================= localStorage ======================= */
const LS = { saved: "lekanot:saved-lists", settings: "lekanot:settings", adminPin: "lekanot:admin-pin" };
function lsGet(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

const CATEGORY_OPTIONS = ["פסח", "פורים", "שבת", "ערב", "בר/בת מצווה", "מותאם אישית"];
const ICONS = { milk:"ti-milk", veg:"ti-apple", meat:"ti-meat", clean:"ti-spray", baby:"ti-baby-carriage", drink:"ti-glass", default:"ti-shopping-bag" };
function guessIcon(name) {
  const n = name || "";
  if (/חלב|גבינה|יוגורט|שמנת/.test(n)) return ICONS.milk;
  if (/עגבני|מלפפון|תפוח|ירק|פרי|בננה|פטר/.test(n)) return ICONS.veg;
  if (/בשר|עוף|דג|נקניק|שניצל/.test(n)) return ICONS.meat;
  if (/ניקוי|אקונומיקה|סבון|מגבון/.test(n)) return ICONS.clean;
  if (/בייבי|חיתול|תינוק/.test(n)) return ICONS.baby;
  if (/קולה|מיץ|משקה|שתיה|בירה|יין/.test(n)) return ICONS.drink;
  return ICONS.default;
}

const state = {
  products: [], cheapest: new Map(), cart: new Map(), maxStores: 2, includeDelivery: false,
  settings: lsGet(LS.settings, { location: "", transport: "car", delivery: {} }),
  qtyDraft: new Map(), versionTaps: 0,
};

/* ======================= חיפוש חכם ======================= */
const CONTEXT_STRIP_WORDS = ["לקידוש","לשבת","לפסח","לפורים","לחג","לארוחה","בשביל","עבור","בבקשה","של","טעים","טעימה"];
function extractCoreQuery(q) {
  const words = q.trim().split(/\s+/).filter(w => !CONTEXT_STRIP_WORDS.includes(w));
  const core = words.join(' ').trim();
  return core || q.trim();
}
function rankProducts(products, term) {
  const t = term.trim();
  if (!t) return products;
  return [...products].sort((a, b) => {
    const ia = a.canonical_name.indexOf(t), ib = b.canonical_name.indexOf(t);
    const pa = ia === -1 ? 999 : ia, pb = ib === -1 ? 999 : ib;
    if (pa !== pb) return pa - pb;
    return a.canonical_name.length - b.canonical_name.length;
  });
}

async function fetchCheapestFor(productIds) {
  if (!productIds.length) return new Map();
  const rows = await sb('prices', { select: 'product_id,price,unit_price', product_id: `in.(${productIds.join(',')})` });
  const map = new Map();
  for (const r of rows) {
    const cur = map.get(r.product_id);
    const price = Number(r.price);
    if (!cur || price < cur.price) map.set(r.product_id, { price, unitPrice: r.unit_price ? Number(r.unit_price) : null });
  }
  return map;
}

/* ======================= ניווט ======================= */
const PAGE_IDS = ['pageCart','pageLists','pageDeals','pageSettings','pageShop','pageResults'];
function openPage(id) { document.getElementById(id).classList.add('open'); }
function closePage(id) { document.getElementById(id).classList.remove('open'); }
function closeAllPages() { PAGE_IDS.forEach(closePage); closeProductSheet(); hideSearchDropdown(); document.getElementById('resultsSubnav').classList.remove('show'); }
function anyPageOpen() { return PAGE_IDS.some(id => document.getElementById(id).classList.contains('open')); }
function setActiveNav(name) { document.querySelectorAll('.navbar button[data-nav]').forEach(b => b.classList.toggle('active', b.dataset.nav === name)); }

document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', (e) => {
  e.preventDefault();
  const target = el.dataset.nav;
  closeAllPages();
  if (target === 'home') { setActiveNav('home'); return; }
  if (target === 'cart') { renderCartPage(); openPage('pageCart'); setActiveNav('cart'); }
  if (target === 'lists') { renderListsPage(); openPage('pageLists'); setActiveNav('lists'); }
  if (target === 'deals') { renderDealsPage(); openPage('pageDeals'); setActiveNav('deals'); }
  if (target === 'settings') { renderSettingsPage(); openPage('pageSettings'); setActiveNav('settings'); }
}));
document.getElementById('avatarBtn').onclick = () => { closeAllPages(); renderSettingsPage(); openPage('pageSettings'); setActiveNav('settings'); };
document.getElementById('footerFeedbackLink').onclick = (e) => { e.preventDefault(); closeAllPages(); renderSettingsPage(); openPage('pageSettings'); setActiveNav('settings'); setTimeout(() => document.getElementById('feedbackBox')?.scrollIntoView({behavior:'smooth'}), 350); };
document.getElementById('brandRow').onclick = () => { closeAllPages(); document.getElementById('searchInput').value=''; setActiveNav('home'); loadInitial(); window.scrollTo({top:0,behavior:'smooth'}); };
document.getElementById('yearNow').textContent = new Date().getFullYear();

/* ======================= גובה הדר דינמי (ל-padding מדויק) ======================= */
function syncHeaderHeight() { document.documentElement.style.setProperty('--header-h', document.getElementById('topHeader').offsetHeight + 'px'); }
window.addEventListener('resize', syncHeaderHeight);

/* ======================= קריסת הדר בגלילה - רק בטלפון, לא הורס את החיפוש ======================= */
const topHeader = document.getElementById('topHeader');
function handleScroll(scrollTop) { topHeader.classList.toggle('collapsed', scrollTop > 60); requestAnimationFrame(syncHeaderHeight); }
window.addEventListener('scroll', () => handleScroll(window.scrollY), { passive: true });
PAGE_IDS.forEach(id => document.getElementById(id).addEventListener('scroll', (e) => handleScroll(e.target.scrollTop), { passive: true }));

/* ======================= חיפוש: בבית מסנן ישירות, בכל עמוד אחר נפתח כ-dropdown ======================= */
function hideSearchDropdown() { document.getElementById('searchDropdown').classList.remove('show'); }
async function fetchProductIdsAtChain(ids, chainId) {
  if (!ids.length || !chainId) return null;
  try {
    const rows = await sb('prices', { select: 'product_id,stores!inner(chain_id)', product_id: `in.(${ids.join(',')})`, 'stores.chain_id': `eq.${chainId}` });
    return new Set(rows.map(r => r.product_id));
  } catch { return null; }
}
async function fuzzySearch(core, limit) {
  try { return await sbRpc('search_products_fuzzy', { q: core, match_limit: limit }); }
  catch { return sb('products', { select: '*', canonical_name: `ilike.*${core}*`, limit: String(limit) }); } // נפילה חזרה אם ה-RPC עוד לא מותקן ב-DB
}
async function applyScope(products) {
  const scope = document.getElementById('searchScope').value;
  if (!scope) return products;
  const ids = await fetchProductIdsAtChain(products.map(p => p.id), scope);
  return ids ? products.filter(p => ids.has(p.id)) : products;
}

async function searchIntoDropdown(q) {
  const dd = document.getElementById('searchDropdown');
  const core = extractCoreQuery(q);
  if (!core.trim()) { hideSearchDropdown(); return; }
  dd.classList.add('show');
  document.getElementById('searchDropdownGrid').innerHTML = `<div class="loading">מחפש…</div>`;
  const rows = await fuzzySearch(core, 40);
  let ranked = rankProducts(rows, core).slice(0, 24);
  ranked = await applyScope(ranked);
  const cheapest = await fetchCheapestFor(ranked.map(p => p.id));
  renderGridInto(ranked, 'searchDropdownGrid', cheapest);
}

let searchDebounce;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const val = e.target.value;
  searchDebounce = setTimeout(() => { anyPageOpen() ? searchIntoDropdown(val) : (hideSearchDropdown(), searchProducts(val)); }, 350);
});

/* ======================= טעינה/חיפוש מוצרים (בית) ======================= */
async function renderGridWithPrices(products) { state.cheapest = await fetchCheapestFor(products.map(p => p.id)); renderGrid(products); }
async function loadInitial() {
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="loading">טוען מוצרים אמיתיים…</div>`;
  try {
    let rows = await sb('products', { select: '*', limit: '40', order: 'created_at.desc', image_url: 'not.is.null' });
    if (rows.length < 20) {
      const more = await sb('products', { select: '*', limit: '40', order: 'created_at.desc' });
      const ids = new Set(rows.map(r => r.id));
      rows = rows.concat(more.filter(r => !ids.has(r.id)));
    }
    state.products = rows;
    await renderGridWithPrices(rows);
  } catch (e) {
    grid.innerHTML = `<div class="empty">אין עדיין חיבור לנתונים (${e.message}).</div>`;
  } finally {
    document.getElementById('loader').classList.add('hide');
    syncHeaderHeight();
  }
}
async function searchProducts(q) {
  if (!q.trim()) return loadInitial();
  const core = extractCoreQuery(q);
  const rows = await fuzzySearch(core, 80);
  let ranked = rankProducts(rows, core).slice(0, 60);
  ranked = await applyScope(ranked);
  state.products = ranked;
  await renderGridWithPrices(ranked);
}
async function populateSearchScope() {
  try {
    const chains = await sb('chains', { select: 'id,display_name' });
    const sel = document.getElementById('searchScope');
    for (const c of chains) sel.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.display_name}</option>`);
    sel.onchange = () => { anyPageOpen() ? searchIntoDropdown(document.getElementById('searchInput').value) : searchProducts(document.getElementById('searchInput').value); };
  } catch {}
}
async function fetchPricesForProduct(productId) {
  return sb('prices', { select: 'id,price,unit_price,in_stock,store_id,product_id,stores(name,city,chain_id,chains(display_name))', product_id: `eq.${productId}` });
}

/* ======================= רינדור גריד (ניתן לכוון לכל container) ======================= */
function priceLineHtml(p, cheapestMap) {
  const c = cheapestMap.get(p.id);
  if (!c) return `<div class="price-line"><span class="unit">אין מחיר עדיין</span></div>`;
  if (p.is_weighted && c.unitPrice) return `<div class="price-line"><span class="lbl">הכי זול</span>${c.unitPrice.toFixed(2)} ₪ <span class="unit">/ ק״ג</span></div>`;
  return `<div class="price-line"><span class="lbl">הכי זול</span>${c.price.toFixed(2)} ₪</div>`;
}
function renderGrid(products) { renderGridInto(products, 'grid', state.cheapest); }
function renderGridInto(products, containerId, cheapestMap) {
  const grid = document.getElementById(containerId);
  if (!products.length) { grid.innerHTML = `<div class="empty">לא נמצאו מוצרים תואמים.</div>`; return; }
  grid.innerHTML = '';
  for (const p of products) {
    const card = document.createElement('div');
    card.className = 'card';
    const draftQty = state.qtyDraft.get(p.id) || 1;
    card.innerHTML = `
      <div class="thumb">${p.image_url ? `<img src="${p.image_url}" alt="" loading="lazy">` : `<i class="ti ${guessIcon(p.canonical_name)}"></i>`}</div>
      <div class="name">${p.canonical_name}</div>
      ${priceLineHtml(p, cheapestMap)}
      <div class="bottom-row">
        <div class="stepper">
          <button data-step="-1" data-id="${p.id}">−</button>
          <div class="numcol"><span class="n" data-qty="${p.id}">${draftQty}</span>${p.is_weighted ? '<span class="unit">ק״ג</span>' : ''}</div>
          <button data-step="1" data-id="${p.id}">+</button>
        </div>
        <button class="add-circle" data-add="${p.id}"><i class="ti ti-plus"></i></button>
      </div>`;
    card.querySelector('.thumb').onclick = () => openProductSheet(p);
    card.querySelector('.name').onclick = () => openProductSheet(p);
    card.querySelectorAll('[data-step]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const step = p.is_weighted ? 0.5 : 1;
      const d = Number(b.dataset.step) * step;
      const cur = state.qtyDraft.get(p.id) || 1;
      const next = Math.max(step, +(cur + d).toFixed(2));
      state.qtyDraft.set(p.id, next);
      card.querySelector(`[data-qty="${p.id}"]`).textContent = next;
    });
    card.querySelector('[data-add]').onclick = (e) => {
      e.stopPropagation();
      addToCart(p, state.qtyDraft.get(p.id) || 1);
      state.qtyDraft.set(p.id, 1); card.querySelector(`[data-qty="${p.id}"]`).textContent = 1;
      const btn = card.querySelector('[data-add]'); btn.classList.add('spin'); setTimeout(() => btn.classList.remove('spin'), 350);
    };
    grid.appendChild(card);
  }
}

function addToCart(product, qty = 1) {
  const existing = state.cart.get(product.id);
  state.cart.set(product.id, { product, qty: existing ? existing.qty + qty : qty, selected: false });
  updateCartBadge();
  if (document.getElementById('pageCart').classList.contains('open')) renderCartPage();
}
function updateCartBadge() {
  const count = state.cart.size;
  const badge = document.getElementById('cartBadge');
  badge.style.display = count ? 'flex' : 'none';
  badge.textContent = count;
}

/* ======================= גיליון מוצר ======================= */
function closeProductSheet() { document.getElementById('productSheet').classList.remove('open'); document.getElementById('productBackdrop').classList.remove('open'); }
document.getElementById('productBackdrop').onclick = closeProductSheet;

async function openProductSheet(product) {
  const content = document.getElementById('productContent');
  content.innerHTML = `<div class="loading">טוען מחירים…</div>`;
  document.getElementById('productSheet').classList.add('open');
  document.getElementById('productBackdrop').classList.add('open');

  const offers = await fetchPricesForProduct(product.id);
  const priceOf = (o) => (product.is_weighted && o.unit_price ? Number(o.unit_price) : Number(o.price));
  const sorted = [...offers].sort((a, b) => priceOf(a) - priceOf(b));
  const cheapest = sorted[0];
  const rest = sorted.slice(1);
  let qty = 1;

  function storeRowHtml(o) {
    const price = priceOf(o);
    return `<div class="store-row ${o.id === cheapest?.id ? 'cheapest' : ''}">
      <div class="names"><b>${o.stores?.chains?.display_name || ''}</b><span>${o.stores?.name || ''} ${o.stores?.city ? '· ' + o.stores.city : ''}</span>
      ${o.in_stock === false ? '<span class="oos">לא זמין - אין במלאי לפי הדיווח האחרון</span>' : ''}</div>
      <div class="price-col">${o.id === cheapest?.id ? '<span class="tag-cheap">הכי זול</span>' : ''}<b>${price.toFixed(2)} ₪${product.is_weighted ? '<span class="unit"> / ק״ג</span>' : ''}</b></div>
    </div>`;
  }

  content.innerHTML = `
    <div class="product-hero">
      <div class="img">${product.image_url ? `<img src="${product.image_url}" alt="">` : `<i class="ti ${guessIcon(product.canonical_name)}"></i>`}</div>
      <div class="info">
        <h1>${product.canonical_name}</h1>
        <div class="product-top-actions" style="margin-top:12px;">
          <div class="stepper"><button id="sheetMinus">−</button><div class="numcol"><span class="n" id="sheetQty">1</span>${product.is_weighted ? '<span class="unit">ק״ג</span>' : ''}</div><button id="sheetPlus">+</button></div>
          <button class="btn primary" id="addFromProductBtn" style="flex:1;"><i class="ti ti-plus"></i> הוסף לרשימה</button>
        </div>
      </div>
    </div>
    <div style="margin-top:16px;">
      ${cheapest ? storeRowHtml(cheapest) : '<div class="empty">אין עדיין מחיר רשום למוצר הזה.</div>'}
      ${rest.length ? `<button class="expand-chains" id="expandChainsBtn"><span>הצג את כל הרשתות (${rest.length})</span><i class="ti ti-chevron-down"></i></button><div id="restChains" style="display:none;">${rest.map(storeRowHtml).join('')}</div>` : ''}
      <div class="stock-note">המחירים מתעדכנים לפי קבצי השקיפות הרשמיים של הרשתות ועשויים להיות שונים במעט מהמחיר בקופה בפועל.</div>
    </div>`;

  document.getElementById('sheetMinus').onclick = () => { const step = product.is_weighted ? 0.5 : 1; qty = Math.max(step, +(qty - step).toFixed(2)); document.getElementById('sheetQty').textContent = qty; };
  document.getElementById('sheetPlus').onclick = () => { const step = product.is_weighted ? 0.5 : 1; qty = +(qty + step).toFixed(2); document.getElementById('sheetQty').textContent = qty; };
  document.getElementById('addFromProductBtn').onclick = () => { addToCart(product, qty); closeProductSheet(); };
  document.getElementById('expandChainsBtn')?.addEventListener('click', (e) => {
    const btn = e.currentTarget, box = document.getElementById('restChains');
    const open = box.style.display !== 'none';
    box.style.display = open ? 'none' : 'block';
    btn.classList.toggle('open', !open);
  });
}

/* ======================= מנוע ההשוואה - לפי רשת, לא לפי סניף ========================
   לרוב הרשתות אין הבדל משמעותי במחיר בין סניפים, ואנחנו ממילא דוגמים רק חלק
   מהסניפים של כל רשת - השוואה לפי סניף ספציפי יצרה תמונה מפוצלת ומטעה
   ("זמין רק בסניף אחד"). לכן: לכל מוצר, לכל רשת, לוקחים את המחיר הזול ביותר
   מבין הסניפים שיש לנו מידע עליהם מאותה רשת - זה "מחיר הרשת" לצורך ההשוואה.
   בעמוד המוצר הבודד (openProductSheet) עדיין מוצג הפירוט המלא לפי סניף. */
async function computePlans() {
  const items = [...state.cart.values()];
  const priceByChain = new Map();
  for (const { product } of items) {
    const rows = await fetchPricesForProduct(product.id);
    const byChain = new Map();
    for (const r of rows) {
      const chainId = r.stores?.chain_id;
      const price = Number(r.price);
      const cur = byChain.get(chainId);
      if (!cur || price < cur.price) byChain.set(chainId, { chainId, chainName: r.stores?.chains?.display_name || '', price, unitPrice: r.unit_price ? Number(r.unit_price) : null, storeName: r.stores?.name || '' });
    }
    priceByChain.set(product.id, [...byChain.values()]);
  }
  const candidateChains = [...new Set([...priceByChain.values()].flat().map(r => r.chainId))];
  function lineCost(entry, offer) { return (entry.product.is_weighted && offer.unitPrice) ? offer.unitPrice * entry.qty : offer.price * entry.qty; }
  function deliveryFor(chainId) { if (!state.includeDelivery) return 0; const f = state.settings.delivery?.[chainId]; return f ? Number(f) : 0; }

  function planSingleBest() {
    let best = null;
    for (const chainId of candidateChains) {
      let total = 0; const missing = []; let chainName = '';
      for (const entry of items) {
        const offer = (priceByChain.get(entry.product.id) || []).find(o => o.chainId === chainId);
        if (!offer) { missing.push(entry.product.canonical_name); continue; }
        total += lineCost(entry, offer); chainName = offer.chainName;
      }
      if (missing.length) continue;
      total += deliveryFor(chainId);
      if (!best || total < best.total) best = { chainId, chainName, total, lines: items.map(e => ({ name: e.product.canonical_name, qty: e.qty, isWeighted: e.product.is_weighted, image: e.product.image_url, offer: (priceByChain.get(e.product.id)||[]).find(o=>o.chainId===chainId) })) };
    }
    return best;
  }
  function allChainTotals() {
    const out = [];
    for (const chainId of candidateChains) {
      let total = 0; const missing = []; let chainName = ''; const lines = [];
      for (const entry of items) {
        const offer = (priceByChain.get(entry.product.id) || []).find(o => o.chainId === chainId);
        if (!offer) { missing.push(entry.product.canonical_name); continue; }
        total += lineCost(entry, offer); chainName = offer.chainName;
        lines.push({ name: entry.product.canonical_name, qty: entry.qty, isWeighted: entry.product.is_weighted, image: entry.product.image_url, offer });
      }
      if (!lines.length) continue;
      total += deliveryFor(chainId);
      out.push({ chainId, chainName, total, missing, lines });
    }
    return out.sort((a, b) => a.total - b.total);
  }
  function splitUnlimited() {
    const byChain = new Map();
    let totalAll = 0; const missing = [];
    for (const entry of items) {
      const offers = priceByChain.get(entry.product.id) || [];
      if (!offers.length) { missing.push(entry.product.canonical_name); continue; }
      const best = offers.reduce((a, b) => lineCost(entry, b) < lineCost(entry, a) ? b : a);
      const cost = lineCost(entry, best);
      totalAll += cost;
      if (!byChain.has(best.chainId)) byChain.set(best.chainId, { chainId: best.chainId, chainName: best.chainName, lines: [], total: 0 });
      const g = byChain.get(best.chainId);
      g.lines.push({ name: entry.product.canonical_name, qty: entry.qty, isWeighted: entry.product.is_weighted, image: entry.product.image_url, offer: best });
      g.total += cost;
    }
    for (const g of byChain.values()) { g.total += deliveryFor(g.chainId); totalAll += deliveryFor(g.chainId); }
    return { groups: [...byChain.values()].sort((a,b)=>b.total-a.total), total: totalAll, missing };
  }
  function splitCapped(n) {
    const scored = candidateChains.map(chainId => {
      let total = 0, covered = 0;
      for (const entry of items) { const offer = (priceByChain.get(entry.product.id) || []).find(o => o.chainId === chainId); if (offer) { total += lineCost(entry, offer); covered++; } }
      return { chainId, total, covered };
    }).sort((a, b) => b.covered - a.covered || a.total - b.total);
    const top = scored.slice(0, Math.min(10, scored.length));
    function combos(arr, size) { if (size === 0) return [[]]; if (arr.length < size) return []; const [first, ...rest] = arr; return [...combos(rest, size - 1).map(c => [first, ...c]), ...combos(rest, size)]; }
    let best = null;
    for (let size = 1; size <= Math.min(n, top.length); size++) {
      for (const combo of combos(top, size)) {
        const chainIds = combo.map(c => c.chainId);
        let total = 0; const missing = []; const groupsMap = new Map();
        for (const entry of items) {
          const offers = (priceByChain.get(entry.product.id) || []).filter(o => chainIds.includes(o.chainId));
          if (!offers.length) { missing.push(entry.product.canonical_name); continue; }
          const b = offers.reduce((a, c) => lineCost(entry, c) < lineCost(entry, a) ? c : a);
          total += lineCost(entry, b);
          if (!groupsMap.has(b.chainId)) groupsMap.set(b.chainId, { chainId:b.chainId, chainName:b.chainName, lines:[], total:0 });
          const g = groupsMap.get(b.chainId); g.lines.push({ name: entry.product.canonical_name, qty: entry.qty, isWeighted: entry.product.is_weighted, image: entry.product.image_url, offer:b }); g.total += lineCost(entry, b);
        }
        if (missing.length) continue;
        for (const g of groupsMap.values()) { g.total += deliveryFor(g.chainId); total += deliveryFor(g.chainId); }
        if (!best || total < best.total) best = { groups: [...groupsMap.values()], total, missing: [] };
      }
    }
    return best;
  }
  return { single: planSingleBest(), allChains: allChainTotals(), splitUnlimited: splitUnlimited(), splitCapped };
}

/* ======================= עגלה ======================= */
function cartAsLines() { return [...state.cart.values()].map(({ product, qty }) => ({ product_id: product.id, name: product.canonical_name, is_weighted: product.is_weighted, qty, image_url: product.image_url || null })); }
function loadLinesIntoCart(lines) { state.cart.clear(); for (const l of lines) state.cart.set(l.product_id, { product: { id: l.product_id, canonical_name: l.name, is_weighted: l.is_weighted, image_url: l.image_url }, qty: l.qty, selected: false }); updateCartBadge(); }

function renderCartPage() {
  const content = document.getElementById('cartContent');
  const items = [...state.cart.entries()];
  const anySelected = items.some(([, v]) => v.selected);
  const rows = items.map(([id, { product, qty, selected }]) => `
    <div class="line-item" data-id="${id}">
      <div class="check-sq ${selected ? 'checked' : ''}" data-select="${id}">${selected ? '<i class="ti ti-check"></i>' : ''}</div>
      <div class="thumb-sm">${product.image_url ? `<img src="${product.image_url}" alt="">` : `<i class="ti ${guessIcon(product.canonical_name)}"></i>`}</div>
      <div class="name">${product.canonical_name}</div>
      <div class="stepper"><button data-cstep="-1" data-id="${id}">−</button><div class="numcol"><span class="n">${qty}</span>${product.is_weighted ? '<span class="unit">ק״ג</span>' : ''}</div><button data-cstep="1" data-id="${id}">+</button></div>
    </div>`).join('');

  content.innerHTML = `
    <div class="select-bar ${anySelected ? 'show' : ''}"><button id="selectAllBtn"><i class="ti ti-checkbox"></i> בחר הכל</button><button id="deleteSelectedBtn" style="color:var(--danger);"><i class="ti ti-trash"></i> מחק מסומנים</button></div>
    ${rows || '<div class="empty">הרשימה ריקה</div>'}
    <div class="row-actions"><button class="btn" id="saveListBtn"><i class="ti ti-device-floppy"></i> שמור רשימה</button><button class="btn" id="copyListBtn"><i class="ti ti-copy"></i> העתק רשימה</button></div>
    <div class="toggle-row"><span>לחשב עם עלות משלוח</span><input type="checkbox" id="deliveryToggle" ${state.includeDelivery ? 'checked' : ''}></div>
    ${items.length ? '<div class="compare-glow-wrap"><button class="btn-compare" id="goCompareBtn">קח אותי להשוואה</button></div>' : ''}`;

  content.querySelectorAll('[data-select]').forEach(el => el.onclick = () => { state.cart.get(el.dataset.select).selected = !state.cart.get(el.dataset.select).selected; renderCartPage(); });
  document.getElementById('selectAllBtn')?.addEventListener('click', () => { for (const v of state.cart.values()) v.selected = true; renderCartPage(); });
  document.getElementById('deleteSelectedBtn')?.addEventListener('click', () => { for (const [id, v] of state.cart.entries()) if (v.selected) state.cart.delete(id); updateCartBadge(); renderCartPage(); });
  content.querySelectorAll('[data-cstep]').forEach(b => b.onclick = () => { const e = state.cart.get(b.dataset.id); const step = e.product.is_weighted ? 0.5 : 1; const d = Number(b.dataset.cstep) * step; e.qty = Math.max(step, +(e.qty + d).toFixed(2)); updateCartBadge(); renderCartPage(); });
  document.getElementById('deliveryToggle').onchange = (e) => { state.includeDelivery = e.target.checked; };
  document.getElementById('saveListBtn').onclick = () => renderSaveListForm();
  document.getElementById('copyListBtn').onclick = async () => { const text = cartAsLines().map(l => `${l.name} — ${l.qty}${l.is_weighted ? ' ק"ג' : ' יח׳'}`).join('\n'); try { await navigator.clipboard.writeText(text); } catch {} };
  document.getElementById('goCompareBtn')?.addEventListener('click', async () => {
    const overlay = document.getElementById('computeOverlay');
    overlay.classList.add('show');
    state.lastPlans = await computePlans();
    overlay.classList.remove('show');
    closeAllPages();
    openPage('pageResults');
    document.getElementById('resultsSubnav').classList.add('show');
    renderResultsView('allChains');
  });
}

function notebookHtml(group, title, sub) {
  return `<div class="notebook">
    <div class="coil">${Array.from({length:9}).map(()=>'<span></span>').join('')}</div>
    <div class="nb-store">${title}</div>
    <div class="nb-sub">${sub}</div>
    ${group.lines.map(nbLineHtml).join('')}
    <div class="nb-total-row"><span style="font-size:12px;color:var(--ink-dim);">סה״כ</span><b>${group.total.toFixed(2)} ₪</b></div>
    ${group.missing && group.missing.length ? `<div class="missing-note">לא זמין כאן: ${group.missing.join(', ')}</div>` : ''}
  </div>`;
}
function nbLineHtml(l) {
  const price = l.offer ? (l.isWeighted && l.offer.unitPrice ? l.offer.unitPrice * l.qty : l.offer.price * l.qty) : null;
  return `<div class="nb-line"><div class="l"><div class="thumb-sm">${l.image ? `<img src="${l.image}">` : `<i class="ti ${guessIcon(l.name)}"></i>`}</div><div class="nm">${l.name} × ${l.qty}${l.isWeighted ? ' ק״ג' : ''}</div></div><div class="pr">${price != null ? price.toFixed(2) + ' ₪' : '—'}</div></div>`;
}

/* ======================= עמוד תוצאות - מלא, לא שכבה ======================= */
document.querySelectorAll('.results-subnav button[data-view]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.results-subnav button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  renderResultsView(b.dataset.view);
});

function renderResultsView(view) {
  const content = document.getElementById('resultsContent');
  const { allChains, splitUnlimited, splitCapped } = state.lastPlans;
  if (view === 'allChains') {
    if (!allChains.length) { content.innerHTML = '<div class="empty">לא נמצא מחיר לאף מוצר ברשימה.</div>'; return; }
    content.innerHTML = `
      <div class="results-grid">${allChains.map((g, i) => chainNotebookHtml(g, `רשת ${g.chainName}`, g.missing.length ? `חסרים ${g.missing.length} פריטים` : 'הרשימה המלאה זמינה כאן', i)).join('')}</div>
      <button class="btn" id="showTableBtn" style="width:100%;margin-top:16px;padding:13px;"><i class="ti ti-table"></i> הצג טבלת השוואה</button>
      <div id="tableHost"></div>`;
    wireNotebookTaps(allChains.map(g => ({ title: `רשת ${g.chainName}`, group: g })));
    document.getElementById('showTableBtn').onclick = () => renderCompareTable(allChains);
  } else {
    content.innerHTML = `
      <div class="split-control"><span style="font-size:12px;color:var(--ink-dim);">להגביל ל</span><input type="range" min="1" max="5" value="${state.maxStores}" id="splitRange"><b id="splitVal">${state.maxStores >= 5 ? 'ללא הגבלה' : state.maxStores}</b></div>
      <div class="results-grid" id="splitGroupsHost"></div>
      <div class="notebook" style="background:var(--neutral-highlight);box-shadow:none;" id="splitTotalBox"></div>`;
    renderSplitGroups(splitUnlimited);
    document.getElementById('splitRange').oninput = (e) => {
      state.maxStores = Number(e.target.value);
      document.getElementById('splitVal').textContent = state.maxStores >= 5 ? 'ללא הגבלה' : state.maxStores;
      renderSplitGroups(state.maxStores >= 5 ? splitUnlimited : splitCapped(state.maxStores));
    };
  }
}
function renderSplitGroups(result) {
  const gh = document.getElementById('splitGroupsHost'); const tb = document.getElementById('splitTotalBox');
  if (!result) { gh.innerHTML = '<div class="empty">אין קומבינציה שמכסה את הכל במגבלה הזו</div>'; tb.innerHTML = ''; return; }
  gh.innerHTML = result.groups.map((g, i) => chainNotebookHtml(g, `רשת ${g.chainName}`, '', i)).join('');
  wireNotebookTaps(result.groups.map(g => ({ title: `רשת ${g.chainName}`, group: g })));
  tb.innerHTML = `<div class="nb-total-row"><span style="font-size:13px;">סה״כ כולל (${result.groups.length} רשתות)</span><b>${result.total.toFixed(2)} ₪</b></div>${result.missing && result.missing.length ? `<div class="missing-note">לא נמצא מחיר עבור: ${result.missing.join(', ')}</div>` : ''}`;
}
function chainNotebookHtml(group, title, sub, idx) { return `<div data-notebook-idx="${idx}" style="cursor:pointer;">${notebookHtml(group, title, sub)}</div>`; }
function wireNotebookTaps(entries) {
  document.querySelectorAll('[data-notebook-idx]').forEach(el => el.onclick = () => openChainShoppingView(entries, Number(el.dataset.notebookIdx)));
}

function renderCompareTable(allChains) {
  const items = [...state.cart.values()];
  const rows = items.map(({ product }) => {
    const cells = allChains.map(g => {
      const line = g.lines.find(l => l.name === product.canonical_name);
      if (!line || !line.offer) return `<td class="na">לא זמין</td>`;
      const price = product.is_weighted && line.offer.unitPrice ? line.offer.unitPrice : line.offer.price;
      return `<td>${price.toFixed(2)} ₪</td>`;
    }).join('');
    return `<tr><td>${product.canonical_name}</td>${cells}</tr>`;
  }).join('');
  document.getElementById('tableHost').innerHTML = `<div class="table-wrap"><table class="compare-table">
    <thead><tr><th></th>${allChains.map(g => `<th>${g.chainName}</th>`).join('')}</tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

/* ======================= מצב קניה במסך מלא - עם מעבר בין הרשימות ======================= */

function renderSaveListForm() {
  const content = document.getElementById('cartContent');
  const optionsHtml = CATEGORY_OPTIONS.map(c => `<option value="${c}">${c}</option>`).join('');
  content.innerHTML = `<h3 style="font-size:15px;margin-bottom:14px;">שמירת רשימה</h3>
    <div class="field"><label>שם הרשימה</label><input type="text" id="listName" placeholder="לדוגמה: קניות לשבת"></div>
    <div class="field"><label>קטגוריה</label><select id="listCategory">${optionsHtml}</select></div>
    <button class="btn primary" style="width:100%;padding:14px;" id="confirmSaveBtn">שמור</button>
    <button class="btn" style="width:100%;padding:12px;margin-top:8px;" id="cancelSaveBtn">ביטול</button>`;
  document.getElementById('cancelSaveBtn').onclick = renderCartPage;
  document.getElementById('confirmSaveBtn').onclick = () => {
    const name = document.getElementById('listName').value.trim() || 'רשימה ללא שם';
    const category = document.getElementById('listCategory').value;
    const saved = lsGet(LS.saved, []);
    saved.unshift({ id: `s_${Date.now()}`, name, category, savedAt: new Date().toISOString(), items: cartAsLines() });
    lsSet(LS.saved, saved);
    renderCartPage();
  };
}

/* ======================= רשימות שמורות ======================= */
function renderListsPage() {
  const content = document.getElementById('listsContent');
  const saved = lsGet(LS.saved, []);
  content.innerHTML = `<div class="new-list-tile" id="newListTile"><i class="ti ti-plus"></i><span>רשימה חדשה</span></div>
    ${saved.length ? saved.map(entry => `
      <div class="list-card" data-id="${entry.id}">
        <div class="row"><b style="font-size:14px;">${entry.name}</b><span class="cat-pill">${entry.category || ''}</span></div>
        <div class="meta">${entry.items.length} מוצרים · ${new Date(entry.savedAt).toLocaleDateString('he-IL')}</div>
        <div class="row-actions" style="margin:10px 0 0;">
          <button class="btn" data-load="${entry.id}"><i class="ti ti-shopping-cart"></i> טען לעגלה</button>
          <button class="btn" data-share="${entry.id}"><i class="ti ti-copy"></i> העתק</button>
          <button class="btn" data-del="${entry.id}" style="color:var(--danger);"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('') : '<div class="empty">עדיין אין רשימות שמורות</div>'}`;

  document.getElementById('newListTile').onclick = () => {
    const name = prompt('שם הרשימה החדשה:');
    if (!name) return;
    const saved2 = lsGet(LS.saved, []);
    saved2.unshift({ id: `s_${Date.now()}`, name, category: 'מותאם אישית', savedAt: new Date().toISOString(), items: [] });
    lsSet(LS.saved, saved2);
    closeAllPages(); setActiveNav('home');
  };
  content.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { const entry = saved.find(e => e.id === b.dataset.load); if (entry) { loadLinesIntoCart(entry.items); renderCartPage(); closeAllPages(); openPage('pageCart'); setActiveNav('cart'); } });
  content.querySelectorAll('[data-share]').forEach(b => b.onclick = async () => { const entry = saved.find(e => e.id === b.dataset.share); const text = `${entry.name}\n` + entry.items.map(l => `${l.name} — ${l.qty}${l.is_weighted ? ' ק"ג' : ''}`).join('\n'); try { await navigator.clipboard.writeText(text); } catch {} });
  content.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { lsSet(LS.saved, saved.filter(e => e.id !== b.dataset.del)); renderListsPage(); });
}

/* ======================= מבצעים ======================= */
async function renderDealsPage() {
  const content = document.getElementById('dealsContent');
  content.innerHTML = `<div class="deals-search-sticky"><div class="field" style="margin:0;"><input type="text" id="dealsSearch" placeholder="חיפוש במבצעים"></div></div><div id="dealsList" class="loading">טוען מבצעים…</div>`;

  async function load(filter) {
    const listEl = document.getElementById('dealsList');
    listEl.innerHTML = `<div class="loading">טוען מבצעים…</div>`;
    try {
      const rows = await sb('promos', { select: '*,products(id,canonical_name,image_url,is_weighted),stores(id,name,chains(display_name))', order: 'updated_at.desc', limit: '60' });
      const filtered = filter ? rows.filter(r => (r.products?.canonical_name || '').includes(filter)) : rows;
      if (!filtered.length) { listEl.innerHTML = '<div class="empty">אין כרגע מבצעים רשומים אצלנו.</div>'; return; }

      // מחיר "לפני" אמיתי: שולפים את שורת המחיר הרגילה של אותו מוצר *באותו סניף בדיוק*,
      // לא ממציאים השוואה - אם היא לא נמצאת, פשוט לא מציגים "לפני" לאותו מוצר.
      const productIds = [...new Set(filtered.map(r => r.products?.id).filter(Boolean))];
      let basePrices = [];
      if (productIds.length) basePrices = await sb('prices', { select: 'product_id,store_id,price', product_id: `in.(${productIds.join(',')})` });
      const baseMap = new Map(basePrices.map(p => [`${p.product_id}:${p.store_id}`, Number(p.price)]));

      listEl.innerHTML = `<div class="deals-grid">${filtered.map(r => {
        const p = r.products; if (!p) return '';
        const was = baseMap.get(`${p.id}:${r.stores?.id}`);
        const now = r.promo_price ? Number(r.promo_price) : null;
        const draftQty = state.qtyDraft.get(p.id) || 1;
        return `
        <div class="card deal-card" data-pid="${p.id}">
          <div class="thumb">${p.image_url ? `<img src="${p.image_url}">` : `<i class="ti ${guessIcon(p.canonical_name)}"></i>`}</div>
          <div class="name">${p.canonical_name}</div>
          <div class="chain-meta">${r.stores?.chains?.display_name || ''}${r.description ? ' · ' + r.description : ''}</div>
          <div class="price-row">${was != null && now != null && was > now ? `<span class="was">${was.toFixed(2)} ₪</span>` : ''}${now != null ? `<span class="now">${now.toFixed(2)} ₪</span>` : ''}</div>
          <div class="bottom-row">
            <div class="stepper"><button data-dstep="-1" data-id="${p.id}">−</button><div class="numcol"><span class="n" data-dqty="${p.id}">${draftQty}</span>${p.is_weighted ? '<span class="unit">ק״ג</span>' : ''}</div><button data-dstep="1" data-id="${p.id}">+</button></div>
            <button class="add-circle" data-dadd="${p.id}"><i class="ti ti-plus"></i></button>
          </div>
        </div>`;
      }).join('')}</div>`;

      listEl.querySelectorAll('.deal-card').forEach(card => {
        const pid = card.dataset.pid;
        const promoRow = filtered.find(r => r.products?.id === pid);
        const product = promoRow.products;
        card.querySelectorAll('[data-dstep]').forEach(b => b.onclick = () => {
          const step = product.is_weighted ? 0.5 : 1;
          const cur = state.qtyDraft.get(pid) || 1;
          const next = Math.max(step, +(cur + Number(b.dataset.dstep) * step).toFixed(2));
          state.qtyDraft.set(pid, next);
          card.querySelector(`[data-dqty="${pid}"]`).textContent = next;
        });
        card.querySelector('[data-dadd]').onclick = (e) => {
          addToCart(product, state.qtyDraft.get(pid) || 1);
          state.qtyDraft.set(pid, 1); card.querySelector(`[data-dqty="${pid}"]`).textContent = 1;
          const btn = e.currentTarget; btn.classList.add('spin'); setTimeout(() => btn.classList.remove('spin'), 350);
        };
      });
    } catch { listEl.innerHTML = '<div class="empty">שגיאה בטעינת מבצעים.</div>'; }
  }
  document.getElementById('dealsSearch').addEventListener('input', (e) => load(e.target.value.trim()));
  load('');
}

/* ======================= הגדרות / משוב / אדמין ======================= */
async function renderSettingsPage() {
  const content = document.getElementById('settingsContent');
  let chains = [];
  try { chains = await sb('chains', { select: 'id,display_name' }); } catch {}
  const deliveryRows = chains.map(c => `<div class="delivery-row"><span>${c.display_name}</span><input type="number" min="0" step="1" data-chain="${c.id}" value="${state.settings.delivery?.[c.id] ?? 0}"></div>`).join('');
  content.innerHTML = `
    <div class="hint" style="margin-bottom:18px;">התחברות עם Google תתווסף בהמשך - אז יופיעו כאן הפרטים האמיתיים שלך.</div>
    <div class="section-title">הגדרות</div>
    <div class="field"><label>המיקום שלי</label><input type="text" id="locationInput" value="${state.settings.location || ''}" placeholder="עיר / יישוב"><div class="hint">עדיין לא פעיל בחישוב בפועל.</div></div>
    <div class="field"><label>איך בד"כ מגיעים לקניות?</label><select id="transportInput">
      <option value="car" ${state.settings.transport==='car'?'selected':''}>ברכב</option><option value="public" ${state.settings.transport==='public'?'selected':''}>תחבורה ציבורית</option><option value="walk" ${state.settings.transport==='walk'?'selected':''}>הליכה</option></select></div>
    <div class="field"><label>עלות משלוח ידועה לפי רשת (₪)</label>${deliveryRows || '<div class="hint">יטען כשיש חיבור ל-DB.</div>'}</div>
    <button class="btn primary" style="width:100%;padding:13px;" id="saveSettingsBtn">שמור הגדרות</button>
    <div class="section-title">עזרה לנו להשתפר</div>
    <div class="field"><label>רעיון לפיצ׳ר, באג, או כל דבר אחר</label><textarea id="feedbackBox" placeholder="מה הייתם רוצים שנוסיף או נתקן?"></textarea></div>
    <button class="btn" style="width:100%;padding:12px;" id="sendFeedbackBtn"><i class="ti ti-send"></i> שלח</button>
    <div class="section-title" id="versionTitle" style="user-select:none;">בקטנה גרסה 1.0</div>
    <div id="adminPanel"></div>`;
  document.getElementById('saveSettingsBtn').onclick = () => { const delivery = {}; content.querySelectorAll('[data-chain]').forEach(inp => { delivery[inp.dataset.chain] = Number(inp.value) || 0; }); state.settings = { location: document.getElementById('locationInput').value.trim(), transport: document.getElementById('transportInput').value, delivery }; lsSet(LS.settings, state.settings); };
  document.getElementById('sendFeedbackBtn').onclick = async () => { const text = document.getElementById('feedbackBox').value.trim(); if (!text) return; try { await sbInsert('feedback', { message: text }); document.getElementById('feedbackBox').value = ''; } catch (e) { alert('לא הצלחנו לשלוח (' + e.message + ')'); } };
  document.getElementById('versionTitle').onclick = () => { state.versionTaps++; if (state.versionTaps >= 7) { state.versionTaps = 0; promptAdminPin(); } };
}
function promptAdminPin() { const expected = lsGet(LS.adminPin, '12345678'); if (prompt('קוד ניהול:') === expected) renderAdminPanel(); }
async function renderAdminPanel() {
  const panel = document.getElementById('adminPanel');
  panel.innerHTML = `<div class="loading">טוען פניות…</div>`;
  let rows = [];
  try { rows = await sb('feedback', { select: '*', order: 'created_at.desc', limit: '50' }); } catch {}
  panel.innerHTML = `<div class="field"><label>קוד ניהול חדש</label><input type="password" id="pinInput" placeholder="1-8 ספרות"></div>
    <button class="btn" id="savePinBtn" style="width:100%;margin-bottom:16px;">שמור קוד</button>
    <div class="field"><label>מפתח ניהול (service key)</label><input type="password" id="adminKeyInput"></div>
    <div class="field"><label>הודעת מערכת</label><textarea id="bannerText"></textarea></div>
    <button class="btn" id="publishBannerBtn" style="width:100%;margin-bottom:8px;">פרסם הודעה</button>
    <button class="btn" id="clearBannerBtn" style="width:100%;margin-bottom:20px;color:var(--danger);">הסר הודעה</button>
    <div class="section-title">פניות אחרונות (${rows.length})</div>
    ${rows.length ? rows.map(r => `<div class="feedback-row">${(r.message||'').replace(/</g,'&lt;')}<div class="meta">${new Date(r.created_at).toLocaleString('he-IL')}</div></div>`).join('') : '<div class="empty">אין עדיין פניות</div>'}`;
  document.getElementById('savePinBtn').onclick = () => { const v = document.getElementById('pinInput').value.trim(); if (v.length >= 1 && v.length <= 8) { lsSet(LS.adminPin, v); alert('נשמר'); } };
  document.getElementById('publishBannerBtn').onclick = async () => { const key = document.getElementById('adminKeyInput').value.trim(); const text = document.getElementById('bannerText').value.trim(); if (!key || !text) return alert('צריך גם מפתח וגם טקסט'); await publishBanner(text, key); };
  document.getElementById('clearBannerBtn').onclick = async () => { const key = document.getElementById('adminKeyInput').value.trim(); if (!key) return alert('צריך מפתח ניהול'); await publishBanner('', key); };
}
async function publishBanner(text, serviceKey) {
  try { const res = await fetch(`${SUPABASE_URL}/rest/v1/site_banner?id=eq.1`, { method: 'PATCH', headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, active: !!text }) }); if (!res.ok) throw new Error(await res.text()); checkSiteBanner(); alert('עודכן'); } catch (e) { alert('נכשל: ' + e.message); }
}
async function checkSiteBanner() {
  try { const rows = await sb('site_banner', { select: 'message,active', id: 'eq.1' }); const banner = document.getElementById('siteBanner'); if (rows[0]?.active && rows[0]?.message) { banner.textContent = rows[0].message; banner.classList.remove('hide'); } else banner.classList.add('hide'); } catch {}
}

/* ======================= סנכרון אחרון - נתון אמיתי מה-DB ======================= */
async function renderLastSync() {
  try {
    const rows = await sb('prices', { select: 'updated_at', order: 'updated_at.desc', limit: '1' });
    if (!rows.length) return;
    const mins = Math.max(1, Math.round((Date.now() - new Date(rows[0].updated_at).getTime()) / 60000));
    document.getElementById('syncLabel').textContent = mins < 60 ? `עודכן\nלפני ${mins} דק׳` : `עודכן\nלפני ${Math.round(mins/60)} שע׳`;
  } catch {}
}
setInterval(renderLastSync, 5 * 60 * 1000);

/* ======================= קטגוריות ======================= */
const CATEGORIES = ['הכל', 'מוצרי חלב', 'פירות וירקות', 'בשר ודגים', 'ניקיון', 'בייבי', 'משקאות'];
const chipsHost = document.getElementById('categoryChips');
CATEGORIES.forEach((c, i) => {
  const chip = document.createElement('div');
  chip.className = 'chip' + (i === 0 ? ' active' : '');
  chip.textContent = c;
  chip.onclick = () => { chipsHost.querySelectorAll('.chip').forEach(x => x.classList.remove('active')); chip.classList.add('active'); searchProducts(i === 0 ? '' : c); };
  chipsHost.appendChild(chip);
});

loadInitial();
checkSiteBanner();
renderLastSync();
syncHeaderHeight();
populateSearchScope();
</script>
