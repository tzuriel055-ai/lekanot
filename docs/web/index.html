<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>בקטנה — פשוט לקנות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root{
    --bg:#F6F9F9; --surface:#FFFFFF;
    --ink:#15312F; --ink-dim:#6E8584; --ink-faint:#9FB2B1;
    --accent:#0E575A; --accent-soft:rgba(14,87,90,0.08); --accent-soft-2:rgba(14,87,90,0.14);
    --gold:#B99750; --danger:#C24B3F;
    --neutral-highlight:#EEF1F0;
    --radius-sq:20px; --radius-sq-sm:14px; --radius-pill:999px;
    --shadow-card:0 1px 14px rgba(14,87,90,0.09);
    --shadow-float:0 8px 28px rgba(14,87,90,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Heebo',sans-serif; color:var(--ink);
    background:var(--bg); min-height:100%;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1,h2,h3{font-family:'Frank Ruhl Libre',serif; font-weight:700; margin:0;}
  button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
  input,select,textarea{font-family:inherit;}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 150px;}
  i[class^="ti-"]{line-height:1;}

  /* ===== מסך טעינה ===== */
  #loader{
    position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;transition:opacity .4s ease;
  }
  #loader.hide{opacity:0;pointer-events:none;}
  #loader img{width:84px;height:84px;object-fit:contain;animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
  .loader-dots{display:flex;gap:7px;}
  .loader-dots span{width:7px;height:7px;border-radius:50%;background:var(--accent-soft-2);animation:dotbounce 1.2s ease-in-out infinite;}
  .loader-dots span:nth-child(2){animation-delay:.15s;}
  .loader-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes dotbounce{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-5px);background:var(--accent);}}

  /* ===== סרגל עליון שמתכווץ בגלילה ===== */
  header.top{
    position:sticky;top:0;z-index:30;padding:14px 16px 10px;
    transition:padding .25s ease;
  }
  header.top .hero{
    max-height:140px;opacity:1;overflow:hidden;transition:max-height .3s ease,opacity .25s ease,margin .3s ease;
    margin-bottom:10px;
  }
  header.top.collapsed .hero{max-height:0;opacity:0;margin-bottom:0;}
  .hero-row{display:flex;align-items:center;justify-content:space-between;max-width:720px;margin:0 auto;padding:0 2px;}
  .brand-row{display:flex;align-items:center;gap:9px;}
  .brand-row img{width:30px;height:30px;object-fit:contain;}
  .brand-row span{font-size:17px;font-weight:500;color:var(--ink);}
  .top-icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:18px;}
  .savings-chip{
    background:var(--surface);border-radius:var(--radius-sq-sm);box-shadow:var(--shadow-card);
    padding:9px 14px;display:flex;align-items:center;gap:8px;max-width:720px;margin:10px auto 0;
  }
  .savings-chip i{color:var(--gold);font-size:17px;}
  .savings-chip .txt{font-size:12px;color:var(--ink-dim);}
  .savings-chip b{color:var(--ink);font-weight:500;}

  .search-bubble{
    background:var(--surface);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);
    padding:5px 7px;display:flex;align-items:center;gap:8px;max-width:720px;margin:0 auto;
    transition:box-shadow .2s ease;
  }
  .search-bubble input{
    flex:1;border:none;outline:none;background:transparent;color:var(--ink);font-size:15px;padding:11px 10px;
  }
  .search-bubble input::placeholder{color:var(--ink-faint);}
  .search-bubble .icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:16px;}

  .chips{display:flex;gap:7px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none;max-width:720px;margin:0 auto;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;padding:8px 16px;border-radius:var(--radius-pill);font-size:13px;color:var(--ink-dim);background:transparent;white-space:nowrap;}
  .chip.active{background:var(--neutral-highlight);color:var(--ink);font-weight:500;}

  /* ===== גריד מוצרים ===== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:13px;margin-top:14px;}
  .card{
    background:var(--surface);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);
    padding:12px;display:flex;flex-direction:column;gap:7px;transition:transform .15s ease;
  }
  .card:active{transform:scale(0.97);}
  .card .thumb{
    aspect-ratio:1/1;border-radius:var(--radius-sq-sm);display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--accent);background:var(--accent-soft);overflow:hidden;
  }
  .card .thumb img{width:100%;height:100%;object-fit:cover;}
  .card .name{font-size:13px;line-height:1.35;min-height:35px;color:var(--ink);}
  .card .meta{font-size:10px;color:var(--ink-faint);}
  .card .bottom-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px;}
  .card .price{font-size:14px;font-weight:500;color:var(--accent);}
  .stepper{display:flex;align-items:center;gap:6px;background:var(--neutral-highlight);border-radius:var(--radius-pill);padding:4px 5px;}
  .stepper button{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-dim);}
  .stepper .n{font-size:12px;min-width:14px;text-align:center;color:var(--ink);}
  .add-circle{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}

  .empty,.loading{color:var(--ink-dim);text-align:center;padding:60px 10px;font-size:14px;}

  /* ===== סרגל תחתון - בועתי, אליפסה מלאה ===== */
  .navbar{
    position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
    display:flex;gap:2px;background:var(--surface);border-radius:var(--radius-pill);
    box-shadow:var(--shadow-float);padding:7px;z-index:40;
  }
  .navbar button{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:7px 15px;border-radius:var(--radius-pill);color:var(--ink-faint);font-size:19px;
  }
  .navbar button .lbl{font-size:10px;color:inherit;}
  .navbar button.active{background:var(--neutral-highlight);color:var(--ink);}
  .navbar .badge{
    position:absolute;top:1px;left:6px;background:var(--danger);color:#fff;font-size:9px;font-weight:700;
    border-radius:999px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* ===== עמוד נפרד (מוצר/עגלה-מלאה/רשימות/פרופיל) ===== */
  .page{
    position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;
    transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.9,.28,1);
  }
  .page.open{transform:translateY(0);}
  .page-top{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;}
  .page-top button.back{width:36px;height:36px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-dim);}
  .page-top h2{font-size:17px;flex:1;}

  /* עמוד מוצר */
  .product-hero{padding:4px 16px 10px;}
  .product-hero .img{aspect-ratio:1.3;border-radius:var(--radius-sq);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:52px;color:var(--accent);overflow:hidden;}
  .product-hero .img img{width:100%;height:100%;object-fit:cover;}
  .product-hero h1{font-size:19px;margin-top:14px;color:var(--ink);}
  .store-row{
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);
    border-radius:var(--radius-sq-sm);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow-card);
  }
  .store-row.cheapest{background:var(--neutral-highlight);box-shadow:none;}
  .store-row .names{display:flex;flex-direction:column;gap:2px;}
  .store-row .names b{font-size:13px;color:var(--ink);}
  .store-row .names span{font-size:11px;color:var(--ink-dim);}
  .store-row .price-col{display:flex;align-items:center;gap:8px;}
  .store-row .price-col b{font-size:15px;color:var(--accent);}
  .tag-cheap{font-size:10px;background:var(--accent);color:#fff;padding:3px 8px;border-radius:var(--radius-pill);}
  .stock-note{font-size:11px;color:var(--ink-faint);padding:4px 2px 14px;line-height:1.6;}

  /* עמוד עגלה */
  .line-item{
    display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--radius-sq-sm);
    padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow-card);position:relative;overflow:hidden;touch-action:pan-y;
  }
  .line-item .thumb-sm{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--accent);flex-shrink:0;overflow:hidden;}
  .line-item .thumb-sm img{width:100%;height:100%;object-fit:cover;}
  .line-item .name{flex:1;font-size:13px;}
  .line-item .kg-input{width:52px;background:var(--neutral-highlight);border:none;border-radius:10px;color:var(--ink);text-align:center;padding:6px;font-size:13px;}
  .line-item .swipe-del{
    position:absolute;inset-inline-end:0;top:0;bottom:0;width:70px;background:var(--danger);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:0 var(--radius-sq-sm) var(--radius-sq-sm) 0;
  }
  .select-check{width:20px;height:20px;border-radius:7px;background:var(--neutral-highlight);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
  .select-check.checked{background:var(--accent);color:#fff;}

  .row-actions{display:flex;gap:9px;margin:16px 0;flex-wrap:wrap;}
  .btn{flex:1;min-width:100px;padding:12px;border-radius:var(--radius-pill);background:var(--surface);box-shadow:var(--shadow-card);color:var(--ink);font-size:12.5px;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;}
  .btn.primary{background:var(--accent);color:#fff;box-shadow:none;font-weight:500;}
  .btn.danger-outline{color:var(--danger);}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:13px;color:var(--ink-dim);}
  .toggle-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);}
  .split-control{display:flex;align-items:center;gap:12px;margin:10px 0;background:var(--surface);border-radius:var(--radius-sq-sm);padding:12px 14px;box-shadow:var(--shadow-card);}
  .split-control input[type=range]{flex:1;accent-color:var(--accent);}

  /* תוצאת השוואה - תצוגת מחברת */
  .notebook{background:var(--surface);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);padding:16px;margin-bottom:14px;}
  .notebook .nb-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:1.5px dashed var(--neutral-highlight);margin-bottom:10px;}
  .notebook .nb-head b{font-size:15px;}
  .notebook .nb-total{font-family:'Frank Ruhl Libre';font-size:20px;color:var(--accent);}
  .nb-line{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12.5px;}
  .nb-line .thumb-sm{width:28px;height:28px;border-radius:9px;}
  .nb-line .nm{flex:1;color:var(--ink);}
  .nb-line .pr{color:var(--ink-dim);}
  .missing-note{font-size:11px;color:var(--gold);margin-top:8px;}
  .nb-actions{display:flex;gap:8px;margin-top:12px;}
  .nb-actions button{flex:1;padding:9px;border-radius:var(--radius-pill);background:var(--neutral-highlight);font-size:12px;color:var(--ink-dim);display:flex;align-items:center;justify-content:center;gap:5px;}

  /* מצב קניה - checklist */
  .shop-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--neutral-highlight);}
  .shop-item.done .nm{text-decoration:line-through;color:var(--ink-faint);}
  .shop-check{width:24px;height:24px;border-radius:50%;background:var(--neutral-highlight);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .2s ease;}
  .shop-item.done .shop-check{background:var(--accent);color:#fff;}

  /* רשימות שמורות */
  .list-card{background:var(--surface);border-radius:var(--radius-sq);box-shadow:var(--shadow-card);padding:15px;margin-bottom:11px;}
  .list-card .row{display:flex;justify-content:space-between;align-items:center;}
  .list-card .cat-pill{font-size:10px;background:var(--neutral-highlight);color:var(--ink-dim);padding:3px 10px;border-radius:var(--radius-pill);}
  .list-card .meta{font-size:11px;color:var(--ink-faint);margin-top:5px;}
  .new-list-tile{
    background:var(--neutral-highlight);border-radius:var(--radius-sq);padding:24px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px;color:var(--ink-dim);
  }
  .new-list-tile i{font-size:24px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--ink-dim);margin-bottom:6px;}
  .field input[type=text],.field input[type=password],.field input[type=number],.field select,.field textarea{
    width:100%;background:var(--surface);box-shadow:var(--shadow-card);border:none;border-radius:var(--radius-sq-sm);
    color:var(--ink);padding:12px 14px;font-size:14px;
  }
  .field textarea{min-height:90px;resize:vertical;}
  .field .hint{font-size:11px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}
  .delivery-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;}
  .delivery-row span{font-size:13px;}
  .delivery-row input{width:76px;background:var(--neutral-highlight);border:none;border-radius:10px;color:var(--ink);padding:6px 10px;text-align:center;}

  /* פרופיל */
  .profile-head{display:flex;align-items:center;gap:13px;padding:6px 2px 18px;}
  .avatar-ring{width:58px;height:58px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--accent);}
  .section-title{font-size:12px;color:var(--ink-faint);margin:20px 2px 8px;text-transform:none;}
  .list-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--radius-sq-sm);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow-card);}
  .list-row .l{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink);}
  .list-row .l i{color:var(--ink-dim);font-size:17px;}
  .list-row .r{color:var(--ink-faint);font-size:14px;}
  .feedback-row{background:var(--surface);border-radius:var(--radius-sq-sm);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-card);font-size:12px;}
  .feedback-row .meta{color:var(--ink-faint);font-size:10px;margin-top:5px;}
  .admin-unlock-dot{width:6px;height:6px;border-radius:50%;background:var(--neutral-highlight);display:inline-block;margin-inline-start:4px;}

  .site-banner{background:var(--gold);color:#3c2e10;font-size:12px;text-align:center;padding:9px 14px;}
  .site-banner.hide{display:none;}

  footer.site-footer{max-width:720px;margin:34px auto 10px;padding:0 16px;color:var(--ink-faint);font-size:11px;text-align:center;line-height:1.9;}
  footer.site-footer a{color:var(--ink-dim);}
  footer.site-footer .flinks{display:flex;justify-content:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}

  @media (min-width:720px){
    .page-inner{max-width:640px;margin:0 auto;}
  }
</style>
</head>
<body>

<div id="loader">
  <img src="assets/logo.png" alt="בקטנה">
  <div class="loader-dots"><span></span><span></span><span></span></div>
</div>

<div class="site-banner hide" id="siteBanner"></div>

<header class="top" id="topHeader">
  <div class="hero">
    <div class="hero-row">
      <div class="brand-row"><img src="assets/logo.png" alt=""><span>בקטנה</span></div>
      <div style="display:flex;gap:4px;">
        <button class="top-icon-btn" id="notifBtn" aria-label="התראות"><i class="ti ti-bell"></i></button>
      </div>
    </div>
    <div class="savings-chip" id="savingsChip" style="display:none;">
      <i class="ti ti-coin"></i>
      <div class="txt">נחסך השנה: <b id="savingsAmount">0 ₪</b></div>
    </div>
  </div>
  <div class="search-bubble">
    <span class="icon"><i class="ti ti-search"></i></span>
    <input id="searchInput" placeholder="מה מחפשים היום?">
  </div>
  <div class="chips" id="categoryChips"></div>
</header>

<div class="wrap">
  <div id="grid" class="grid"></div>
  <footer class="site-footer">
    <div class="flinks">
      <a href="#" data-nav="profile">פרופיל</a>
      <a href="#" data-nav="lists">הרשימות שלי</a>
      <a href="#" id="footerFeedbackLink">שיתוף רעיון</a>
    </div>
    <div>בקטנה — פשוט לקנות © <span id="yearNow"></span></div>
    <div>המחירים מבוססים על קובצי שקיפות המחירים הרשמיים של הרשתות ועשויים להשתנות מעת לעת.</div>
  </footer>
</div>

<div class="navbar">
  <button class="active" data-nav="home"><i class="ti ti-home"></i><span class="lbl">בית</span></button>
  <button data-nav="cart"><i class="ti ti-shopping-cart"></i><span class="badge" id="cartBadge" style="display:none;">0</span><span class="lbl">עגלה</span></button>
  <button data-nav="lists"><i class="ti ti-list"></i><span class="lbl">רשימות</span></button>
  <button data-nav="profile"><i class="ti ti-user-circle"></i><span class="lbl">פרופיל</span></button>
</div>

<!-- עמוד מוצר -->
<div class="page" id="pageProduct">
  <div class="page-inner">
    <div class="page-top"><button class="back" data-close="pageProduct"><i class="ti ti-arrow-right"></i></button><h2>פרטי מוצר</h2></div>
    <div id="productContent"></div>
  </div>
</div>

<!-- עמוד עגלה -->
<div class="page" id="pageCart">
  <div class="page-inner">
    <div class="page-top"><button class="back" data-close="pageCart"><i class="ti ti-arrow-right"></i></button><h2>הרשימה שלי</h2></div>
    <div class="wrap" style="padding-top:0;" id="cartContent"></div>
  </div>
</div>

<!-- עמוד רשימות -->
<div class="page" id="pageLists">
  <div class="page-inner">
    <div class="page-top"><button class="back" data-close="pageLists"><i class="ti ti-arrow-right"></i></button><h2>הרשימות שלי</h2></div>
    <div class="wrap" style="padding-top:0;" id="listsContent"></div>
  </div>
</div>

<!-- עמוד פרופיל -->
<div class="page" id="pageProfile">
  <div class="page-inner">
    <div class="page-top"><button class="back" data-close="pageProfile"><i class="ti ti-arrow-right"></i></button><h2>פרופיל</h2></div>
    <div class="wrap" style="padding-top:0;" id="profileContent"></div>
  </div>
</div>

<script>
/* ======================= הגדרות חיבור ל-Supabase ======================= */
const SUPABASE_URL = "https://zkctsixcgjoymvcbiacm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_0M3Fl16g6zDg9XQr319Ldw_fNUSEZ4b";

function sbHeaders(extra) {
  const h = { apikey: SUPABASE_ANON_KEY, ...extra };
  if (!SUPABASE_ANON_KEY.startsWith("sb_")) h.Authorization = `Bearer ${SUPABASE_ANON_KEY}`;
  return h;
}
async function sb(path, params = {}) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}?${qs}`, { headers: sbHeaders() });
  if (!res.ok) throw new Error(`Supabase error ${res.status}: ${await res.text()}`);
  return res.json();
}
async function sbInsert(path, body, extraHeaders) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method: "POST",
    headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=representation", ...(extraHeaders || {}) }),
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Supabase insert error ${res.status}: ${await res.text()}`);
  return res.json();
}

/* ======================= localStorage ======================= */
const LS = {
  saved: "lekanot:saved-lists", settings: "lekanot:settings",
  activeListId: "lekanot:active-list", adminPin: "lekanot:admin-pin", adminKey: "lekanot:admin-session-key",
};
function lsGet(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function lsSet(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }

const CATEGORY_OPTIONS = ["פסח", "פורים", "שבת", "ערב", "בר/בת מצווה", "מותאם אישית"];
const ICONS = {
  milk: "ti-milk", veg: "ti-apple", meat: "ti-meat", clean: "ti-spray", baby: "ti-baby-carriage",
  drink: "ti-glass", default: "ti-shopping-bag",
};
function guessIcon(name) {
  const n = name || "";
  if (/חלב|גבינה|יוגורט|שמנת/.test(n)) return ICONS.milk;
  if (/עגבני|מלפפון|תפוח|ירק|פרי|בננה|פטר/.test(n)) return ICONS.veg;
  if (/בשר|עוף|דג|נקניק|שניצל/.test(n)) return ICONS.meat;
  if (/ניקוי|אקונומיקה|סבון|מגבון/.test(n)) return ICONS.clean;
  if (/בייבי|חיתול|תינוק/.test(n)) return ICONS.baby;
  if (/קולה|מיץ|משקה|שתיה|בירה/.test(n)) return ICONS.drink;
  return ICONS.default;
}

async function loadInitial() {
  const grid = document.getElementById('grid');
  grid.innerHTML = `<div class="loading">טוען מוצרים אמיתיים…</div>`;
  try {
    // מוצגים קודם מוצרים עם תמונה אמיתית (לא נעילה מוחלטת - אם אין מספיק, ממלאים גם בלי)
    let rows = await sb('products', { select: '*', limit: '40', order: 'created_at.desc', image_url: 'not.is.null' });
    if (rows.length < 20) {
      const more = await sb('products', { select: '*', limit: '40', order: 'created_at.desc' });
      const ids = new Set(rows.map(r => r.id));
      rows = rows.concat(more.filter(r => !ids.has(r.id)));
    }
    state.products = rows;
    renderGrid(rows);
  } catch (e) {
    grid.innerHTML = `<div class="empty">אין עדיין חיבור לנתונים (${e.message}).</div>`;
  } finally {
    document.getElementById('loader').classList.add('hide');
  }
}
async function searchProducts(q) {
  if (!q.trim()) return loadInitial();
  const rows = await sb('products', { select: '*', canonical_name: `ilike.*${q}*`, limit: '60' });
  state.products = rows;
  renderGrid(rows);
}
async function fetchPricesForProduct(productId) {
  return sb('prices', {
    select: 'id,price,unit_price,in_stock,store_id,product_id,stores(name,city,chain_id,chains(display_name))',
    product_id: `eq.${productId}`,
  });
}

/* ======================= גריד מוצרים ======================= */
function renderGrid(products) {
  const grid = document.getElementById('grid');
  if (!products.length) { grid.innerHTML = `<div class="empty">לא נמצאו מוצרים תואמים.</div>`; return; }
  grid.innerHTML = '';
  for (const p of products) {
    const card = document.createElement('div');
    card.className = 'card';
    const draftQty = state.qtyDraft.get(p.id) || 1;
    card.innerHTML = `
      <div class="thumb">${p.image_url ? `<img src="${p.image_url}" alt="" loading="lazy">` : `<i class="ti ${guessIcon(p.canonical_name)}"></i>`}</div>
      <div class="name">${p.canonical_name}</div>
      <div class="meta">${p.is_weighted ? 'לפי ק״ג' : ''}</div>
      <div class="bottom-row">
        <div class="stepper">
          <button data-step="-1" data-id="${p.id}">−</button>
          <span class="n" data-qty="${p.id}">${draftQty}</span>
          <button data-step="1" data-id="${p.id}">+</button>
        </div>
        <button class="add-circle" data-add="${p.id}"><i class="ti ti-plus"></i></button>
      </div>`;
    card.querySelector('.thumb').onclick = () => openProductPage(p);
    card.querySelector('.name').onclick = () => openProductPage(p);
    card.querySelectorAll('[data-step]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const d = Number(b.dataset.step);
      const cur = state.qtyDraft.get(p.id) || 1;
      const next = Math.max(1, cur + d);
      state.qtyDraft.set(p.id, next);
      card.querySelector(`[data-qty="${p.id}"]`).textContent = next;
    });
    card.querySelector('[data-add]').onclick = (e) => { e.stopPropagation(); addToCart(p, state.qtyDraft.get(p.id) || 1); state.qtyDraft.set(p.id, 1); card.querySelector(`[data-qty="${p.id}"]`).textContent = 1; };
    grid.appendChild(card);
  }
}

function addToCart(product, qty = 1) {
  const existing = state.cart.get(product.id);
  state.cart.set(product.id, { product, qty: existing ? existing.qty + qty : qty, selected: false });
  updateCartBadge();
}
function updateCartBadge() {
  const count = state.cart.size;
  const badge = document.getElementById('cartBadge');
  badge.style.display = count ? 'flex' : 'none';
  badge.textContent = count;
}

/* ======================= מנוע ההשוואה ======================= */
async function computePlans() {
  const items = [...state.cart.values()];
  const priceMap = new Map();
  for (const { product } of items) {
    const rows = await fetchPricesForProduct(product.id);
    priceMap.set(product.id, rows.map(r => ({
      storeId: r.store_id, storeName: r.stores?.name || '', chainId: r.stores?.chain_id,
      chainName: r.stores?.chains?.display_name || '', price: Number(r.price),
      unitPrice: r.unit_price ? Number(r.unit_price) : null,
    })));
  }
  const candidateStores = [...new Set([...priceMap.values()].flat().map(r => r.storeId))];
  function lineCost(entry, offer) { return (entry.product.is_weighted && offer.unitPrice) ? offer.unitPrice * entry.qty : offer.price * entry.qty; }
  function deliveryFor(chainId) { if (!state.includeDelivery) return 0; const f = state.settings.delivery?.[chainId]; return f ? Number(f) : 0; }

  function planSingleBest() {
    let best = null;
    for (const storeId of candidateStores) {
      let total = 0; const missing = []; let storeName = '', chainName = '', chainId = null;
      for (const entry of items) {
        const offer = (priceMap.get(entry.product.id) || []).find(o => o.storeId === storeId);
        if (!offer) { missing.push(entry.product.canonical_name); continue; }
        total += lineCost(entry, offer); storeName = offer.storeName; chainName = offer.chainName; chainId = offer.chainId;
      }
      if (missing.length) continue;
      total += deliveryFor(chainId);
      if (!best || total < best.total) best = { title: 'חנות אחת', chainName, storeName, total, lines: items.map(e => ({ name: e.product.canonical_name, qty: e.qty, isWeighted: e.product.is_weighted, image: e.product.image_url, price: (priceMap.get(e.product.id)||[]).find(o=>o.storeId===storeId) })) };
    }
    return best;
  }
  function planUnlimited() {
    let total = 0; const storesUsed = new Map(); const missing = [];
    for (const entry of items) {
      const offers = priceMap.get(entry.product.id) || [];
      if (!offers.length) { missing.push(entry.product.canonical_name); continue; }
      const best = offers.reduce((a, b) => lineCost(entry, b) < lineCost(entry, a) ? b : a);
      total += lineCost(entry, best);
      storesUsed.set(best.chainId, `${best.chainName} · ${best.storeName}`);
    }
    for (const chainId of storesUsed.keys()) total += deliveryFor(chainId);
    return { title: 'פיצול מקסימלי', total, storesUsed: [...storesUsed.values()], missing, storeCount: storesUsed.size };
  }
  function planLimited(n) {
    const scored = candidateStores.map(storeId => {
      let total = 0, covered = 0;
      for (const entry of items) {
        const offer = (priceMap.get(entry.product.id) || []).find(o => o.storeId === storeId);
        if (offer) { total += lineCost(entry, offer); covered++; }
      }
      return { storeId, total, covered };
    }).sort((a, b) => b.covered - a.covered || a.total - b.total);
    const top = scored.slice(0, Math.min(10, scored.length));
    function combos(arr, size) {
      if (size === 0) return [[]];
      if (arr.length < size) return [];
      const [first, ...rest] = arr;
      return [...combos(rest, size - 1).map(c => [first, ...c]), ...combos(rest, size)];
    }
    let best = null;
    for (let size = 1; size <= Math.min(n, top.length); size++) {
      for (const combo of combos(top, size)) {
        const storeIds = combo.map(c => c.storeId);
        let total = 0; const missing = []; const usedChains = new Map();
        for (const entry of items) {
          const offers = (priceMap.get(entry.product.id) || []).filter(o => storeIds.includes(o.storeId));
          if (!offers.length) { missing.push(entry.product.canonical_name); continue; }
          const b = offers.reduce((a, c) => lineCost(entry, c) < lineCost(entry, a) ? c : a);
          total += lineCost(entry, b);
          usedChains.set(b.chainId, `${b.chainName} · ${b.storeName}`);
        }
        if (missing.length) continue;
        for (const chainId of usedChains.keys()) total += deliveryFor(chainId);
        if (!best || total < best.total) best = { title: `עד ${n} חנויות`, total, storesUsed: [...usedChains.values()] };
      }
    }
    return best;
  }
  return { unlimited: planUnlimited(), single: planSingleBest(), limited: state.maxStores >= 1 ? planLimited(state.maxStores) : null };
}

/* ======================= עגלה ======================= */
function cartAsLines() {
  return [...state.cart.values()].map(({ product, qty }) => ({
    product_id: product.id, name: product.canonical_name, is_weighted: product.is_weighted, qty, image_url: product.image_url || null,
  }));
}
function loadLinesIntoCart(lines) {
  state.cart.clear();
  for (const l of lines) state.cart.set(l.product_id, { product: { id: l.product_id, canonical_name: l.name, is_weighted: l.is_weighted, image_url: l.image_url }, qty: l.qty, selected: false });
  updateCartBadge();
}

function renderCartPage() {
  const content = document.getElementById('cartContent');
  const items = [...state.cart.entries()];
  const rows = items.map(([id, { product, qty, selected }]) => `
    <div class="line-item" data-id="${id}">
      <div class="select-check ${selected ? 'checked' : ''}" data-select="${id}">${selected ? '<i class="ti ti-check"></i>' : ''}</div>
      <div class="thumb-sm">${product.image_url ? `<img src="${product.image_url}" alt="">` : `<i class="ti ${guessIcon(product.canonical_name)}"></i>`}</div>
      <div class="name">${product.canonical_name}</div>
      ${product.is_weighted
        ? `<input class="kg-input" type="number" min="0.1" step="0.1" value="${qty}" data-kg="${id}">`
        : `<div class="stepper"><button data-cstep="-1" data-id="${id}">−</button><span class="n">${qty}</span><button data-cstep="1" data-id="${id}">+</button></div>`}
    </div>`).join('');

  content.innerHTML = `
    ${state.activeListId ? `<div class="hint" style="margin-bottom:10px;">מוסיפים עכשיו לרשימה שמורה - לא לעגלה הכללית.</div>` : ''}
    ${rows || '<div class="empty">הרשימה ריקה</div>'}
    <div class="row-actions">
      <button class="btn" id="selectAllBtn"><i class="ti ti-checkbox"></i> בחר הכל</button>
      <button class="btn danger-outline" id="deleteSelectedBtn"><i class="ti ti-trash"></i> מחק מסומנים</button>
    </div>
    <div class="row-actions">
      <button class="btn" id="saveListBtn"><i class="ti ti-device-floppy"></i> שמור רשימה</button>
      <button class="btn" id="copyListBtn"><i class="ti ti-copy"></i> העתק רשימה</button>
      <button class="btn" id="shopModeBtn"><i class="ti ti-checklist"></i> מצב קניה</button>
    </div>
    <div class="split-control">
      <span style="font-size:12px;color:var(--ink-dim);">פיצול עד</span>
      <input type="range" min="1" max="4" value="${state.maxStores}" id="splitRange">
      <b id="splitVal">${state.maxStores}</b>
    </div>
    <div class="toggle-row"><span>לחשב עם עלות משלוח</span><input type="checkbox" id="deliveryToggle" ${state.includeDelivery ? 'checked' : ''}></div>
    <button class="btn primary" style="width:100%;padding:14px;margin:8px 0 14px;" id="compareBtn">קח אותי להשוואה</button>
    <div id="plansHost"></div>`;

  // גרירה ימינה למחיקה (swipe-to-delete)
  content.querySelectorAll('.line-item').forEach(row => {
    let startX = null;
    row.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    row.addEventListener('touchmove', (e) => {
      if (startX === null) return;
      const dx = e.touches[0].clientX - startX;
      if (dx > 0) row.style.transform = `translateX(${Math.min(dx, 90)}px)`;
    }, { passive: true });
    row.addEventListener('touchend', (e) => {
      if (startX === null) return;
      const dx = (e.changedTouches[0].clientX - startX);
      row.style.transform = '';
      if (dx > 70) { state.cart.delete(row.dataset.id); updateCartBadge(); renderCartPage(); }
      startX = null;
    });
  });

  content.querySelectorAll('[data-select]').forEach(el => el.onclick = () => {
    const entry = state.cart.get(el.dataset.select);
    entry.selected = !entry.selected;
    renderCartPage();
  });
  document.getElementById('selectAllBtn').onclick = () => { for (const v of state.cart.values()) v.selected = true; renderCartPage(); };
  document.getElementById('deleteSelectedBtn').onclick = () => {
    for (const [id, v] of state.cart.entries()) if (v.selected) state.cart.delete(id);
    updateCartBadge(); renderCartPage();
  };
  content.querySelectorAll('[data-cstep]').forEach(b => b.onclick = () => {
    const e = state.cart.get(b.dataset.id); const d = Number(b.dataset.cstep);
    e.qty = Math.max(1, e.qty + d); if (e.qty <= 0) state.cart.delete(b.dataset.id);
    updateCartBadge(); renderCartPage();
  });
  content.querySelectorAll('[data-kg]').forEach(inp => inp.onchange = () => { state.cart.get(inp.dataset.kg).qty = Math.max(0.1, Number(inp.value)); });
  document.getElementById('splitRange').oninput = (e) => { state.maxStores = Number(e.target.value); document.getElementById('splitVal').textContent = state.maxStores; };
  document.getElementById('deliveryToggle').onchange = (e) => { state.includeDelivery = e.target.checked; };
  document.getElementById('saveListBtn').onclick = () => renderSaveListForm();
  document.getElementById('copyListBtn').onclick = async () => {
    const text = cartAsLines().map(l => `${l.name} — ${l.qty}${l.is_weighted ? ' ק"ג' : ' יח׳'}`).join('\n');
    try { await navigator.clipboard.writeText(text); } catch {}
  };
  document.getElementById('shopModeBtn').onclick = () => renderShopMode();
  document.getElementById('compareBtn').onclick = async () => {
    const host = document.getElementById('plansHost');
    host.innerHTML = `<div class="loading">מחשב את הפיצול הזול ביותר…</div>`;
    const { unlimited, single, limited } = await computePlans();
    let html = '';
    if (single) {
      html += `<div class="notebook">
        <div class="nb-head"><b>${single.chainName} · ${single.storeName}</b><span class="nb-total">${single.total.toFixed(2)} ₪</span></div>
        ${single.lines.map(l => `<div class="nb-line"><div class="thumb-sm">${l.image ? `<img src="${l.image}">` : `<i class="ti ${guessIcon(l.name)}"></i>`}</div><div class="nm">${l.name} × ${l.qty}</div><div class="pr">${l.price ? (l.isWeighted && l.price.unitPrice ? (l.price.unitPrice*l.qty).toFixed(2) : (l.price.price*l.qty).toFixed(2)) : '—'} ₪</div></div>`).join('')}
        <div class="nb-actions"><button id="copyNbBtn"><i class="ti ti-copy"></i> העתק</button><button id="shareNbBtn"><i class="ti ti-share"></i> שתף</button></div>
      </div>`;
    }
    html += `<div class="notebook">
      <div class="nb-head"><b>פיצול מקסימלי - הכי זול</b><span class="nb-total">${unlimited.total.toFixed(2)} ₪</span></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;">${unlimited.storesUsed.map(s => `<span class="chip active" style="font-size:11px;">${s}</span>`).join('')}</div>
      ${unlimited.missing.length ? `<div class="missing-note">לא נמצא מחיר עבור: ${unlimited.missing.join(', ')}</div>` : ''}
    </div>`;
    if (limited) {
      html += `<div class="notebook">
        <div class="nb-head"><b>${limited.title}</b><span class="nb-total">${limited.total != null ? limited.total.toFixed(2) + ' ₪' : '—'}</span></div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;">${(limited.storesUsed||[]).map(s => `<span class="chip active" style="font-size:11px;">${s}</span>`).join('')}</div>
      </div>`;
    }
    host.innerHTML = html;
    document.getElementById('copyNbBtn')?.addEventListener('click', async () => {
      const text = single.lines.map(l => `${l.name} × ${l.qty}`).join('\n') + `\n\nסה״כ ב${single.chainName}: ${single.total.toFixed(2)} ₪`;
      try { await navigator.clipboard.writeText(text); } catch {}
    });
    document.getElementById('shareNbBtn')?.addEventListener('click', async () => {
      const text = `רשימת קניות מ-בקטנה — ${single.chainName}, סה״כ ${single.total.toFixed(2)} ₪`;
      if (navigator.share) { try { await navigator.share({ text }); } catch {} }
      else { try { await navigator.clipboard.writeText(text); } catch {} }
    });
  };
}

  const content = document.getElementById('cartContent');
  const optionsHtml = CATEGORY_OPTIONS.map(c => `<option value="${c}">${c}</option>`).join('');
  content.innerHTML = `
    <h3 style="font-size:15px;margin-bottom:14px;">שמירת רשימה</h3>
    <div class="field"><label>שם הרשימה</label><input type="text" id="listName" placeholder="לדוגמה: קניות לשבת"></div>
    <div class="field"><label>קטגוריה</label><select id="listCategory">${optionsHtml}</select></div>
    <button class="btn primary" style="width:100%;padding:14px;" id="confirmSaveBtn">שמור</button>
    <button class="btn" style="width:100%;padding:12px;margin-top:8px;" id="cancelSaveBtn">ביטול</button>`;
  document.getElementById('cancelSaveBtn').onclick = renderCartPage;
  document.getElementById('confirmSaveBtn').onclick = () => {
    const name = document.getElementById('listName').value.trim() || 'רשימה ללא שם';
    const category = document.getElementById('listCategory').value;
    const saved = lsGet(LS.saved, []);
    saved.unshift({ id: `s_${Date.now()}`, name, category, savedAt: new Date().toISOString(), items: cartAsLines() });
    lsSet(LS.saved, saved);
    renderCartPage();
  };
}

function renderShopMode() {
  const content = document.getElementById('cartContent');
  const items = [...state.cart.entries()];
  content.innerHTML = `
    <h3 style="font-size:15px;margin-bottom:6px;">מצב קניה</h3>
    <div class="hint" style="margin-bottom:12px;">סמנו מוצר שכבר הכנסתם לעגלה בפועל בחנות.</div>
    <div id="shopList">
      ${items.map(([id, { product, qty }]) => `
        <div class="shop-item" data-id="${id}">
          <div class="shop-check"></div>
          <div class="thumb-sm">${product.image_url ? `<img src="${product.image_url}">` : `<i class="ti ${guessIcon(product.canonical_name)}"></i>`}</div>
          <div class="nm" style="flex:1;font-size:13px;">${product.canonical_name} × ${qty}</div>
        </div>`).join('')}
    </div>
    <button class="btn" style="width:100%;padding:12px;margin-top:16px;" id="backToCartBtn">חזרה לעריכה</button>`;
  document.getElementById('backToCartBtn').onclick = renderCartPage;
  content.querySelectorAll('.shop-item').forEach(row => row.onclick = () => row.classList.toggle('done'));
}

/* ======================= רשימות שמורות ======================= */
function renderListsPage() {
  const content = document.getElementById('listsContent');
  const saved = lsGet(LS.saved, []);
  content.innerHTML = `
    <div class="new-list-tile" id="newListTile"><i class="ti ti-plus"></i><span>רשימה חדשה</span></div>
    ${saved.length ? saved.map(entry => `
      <div class="list-card" data-id="${entry.id}">
        <div class="row"><b style="font-size:14px;">${entry.name}</b><span class="cat-pill">${entry.category || ''}</span></div>
        <div class="meta">${entry.items.length} מוצרים · ${new Date(entry.savedAt).toLocaleDateString('he-IL')}</div>
        <div class="row-actions" style="margin:10px 0 0;">
          <button class="btn" data-load="${entry.id}"><i class="ti ti-shopping-cart"></i> טען לעגלה</button>
          <button class="btn" data-share="${entry.id}"><i class="ti ti-copy"></i> העתק</button>
          <button class="btn danger-outline" data-del="${entry.id}"><i class="ti ti-trash"></i></button>
        </div>
      </div>`).join('') : '<div class="empty">עדיין אין רשימות שמורות</div>'}`;

  document.getElementById('newListTile').onclick = () => {
    const name = prompt('שם הרשימה החדשה:');
    if (!name) return;
    const id = `s_${Date.now()}`;
    const saved2 = lsGet(LS.saved, []);
    saved2.unshift({ id, name, category: 'מותאם אישית', savedAt: new Date().toISOString(), items: [] });
    lsSet(LS.saved, saved2);
    state.activeListId = id; lsSet(LS.activeListId, id);
    state.cart.clear(); updateCartBadge();
    closePage('pageLists'); setActiveNav('home');
  };
  content.querySelectorAll('[data-load]').forEach(b => b.onclick = () => {
    const entry = saved.find(e => e.id === b.dataset.load);
    if (entry) { loadLinesIntoCart(entry.items); renderCartPage(); openPage('pageCart'); closePage('pageLists'); setActiveNav('cart'); }
  });
  content.querySelectorAll('[data-share]').forEach(b => b.onclick = async () => {
    const entry = saved.find(e => e.id === b.dataset.share);
    const text = `${entry.name}\n` + entry.items.map(l => `${l.name} — ${l.qty}${l.is_weighted ? ' ק"ג' : ''}`).join('\n');
    try { await navigator.clipboard.writeText(text); } catch {}
  });
  content.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    lsSet(LS.saved, saved.filter(e => e.id !== b.dataset.del));
    renderListsPage();
  });
}

/* ======================= פרופיל / הגדרות / משוב / אדמין ======================= */
async function renderProfilePage() {
  const content = document.getElementById('profileContent');
  let chains = [];
  try { chains = await sb('chains', { select: 'id,display_name' }); } catch {}
  const deliveryRows = chains.map(c => `
    <div class="delivery-row"><span>${c.display_name}</span><input type="number" min="0" step="1" data-chain="${c.id}" value="${state.settings.delivery?.[c.id] ?? 0}"></div>`).join('');

  content.innerHTML = `
    <div class="profile-head">
      <div class="avatar-ring"><i class="ti ti-user"></i></div>
      <div>
        <b style="font-size:15px;">אורח</b>
        <div class="hint" style="margin-top:2px;">התחברות עם Google תתווסף בהמשך - אז יופיעו כאן השם והתמונה האמיתיים שלך.</div>
      </div>
    </div>

    <div class="section-title">הגדרות</div>
    <div class="field"><label>המיקום שלי</label><input type="text" id="locationInput" value="${state.settings.location || ''}" placeholder="עיר / יישוב">
      <div class="hint">עדיין לא פעיל בחישוב בפועל - ממתין למיפוי מדויק של הסניפים.</div></div>
    <div class="field"><label>איך בד"כ מגיעים לקניות?</label>
      <select id="transportInput">
        <option value="car" ${state.settings.transport==='car'?'selected':''}>ברכב</option>
        <option value="public" ${state.settings.transport==='public'?'selected':''}>תחבורה ציבורית</option>
        <option value="walk" ${state.settings.transport==='walk'?'selected':''}>הליכה</option>
      </select></div>
    <div class="field"><label>עלות משלוח ידועה לפי רשת (₪)</label>${deliveryRows || '<div class="hint">יטען כשיש חיבור ל-DB.</div>'}</div>
    <button class="btn primary" style="width:100%;padding:13px;" id="saveSettingsBtn">שמור הגדרות</button>

    <div class="section-title">עזרה לנו להשתפר</div>
    <div class="field">
      <label>רעיון לפיצ׳ר, באג, או כל דבר אחר</label>
      <textarea id="feedbackBox" placeholder="מה הייתם רוצים שנוסיף או נתקן?"></textarea>
    </div>
    <button class="btn" style="width:100%;padding:12px;" id="sendFeedbackBtn"><i class="ti ti-send"></i> שלח</button>

    <div class="section-title" id="versionTitle" style="user-select:none;">בקטנה גרסה 1.0<span class="admin-unlock-dot"></span></div>
    <div id="adminPanel"></div>`;

  document.getElementById('saveSettingsBtn').onclick = () => {
    const delivery = {};
    content.querySelectorAll('[data-chain]').forEach(inp => { delivery[inp.dataset.chain] = Number(inp.value) || 0; });
    state.settings = { location: document.getElementById('locationInput').value.trim(), transport: document.getElementById('transportInput').value, delivery };
    lsSet(LS.settings, state.settings);
  };
  document.getElementById('sendFeedbackBtn').onclick = async () => {
    const text = document.getElementById('feedbackBox').value.trim();
    if (!text) return;
    try {
      await sbInsert('feedback', { message: text });
      document.getElementById('feedbackBox').value = '';
      document.getElementById('sendFeedbackBtn').textContent = 'נשלח, תודה!';
      setTimeout(() => { document.getElementById('sendFeedbackBtn').innerHTML = '<i class="ti ti-send"></i> שלח'; }, 2000);
    } catch (e) { alert('לא הצלחנו לשלוח כרגע (' + e.message + ')'); }
  };

  document.getElementById('versionTitle').onclick = () => {
    state.versionTaps++;
    if (state.versionTaps >= 7) { state.versionTaps = 0; promptAdminPin(); }
  };
}

function promptAdminPin() {
  const expected = lsGet(LS.adminPin, '12345678');
  const entered = prompt('קוד ניהול:');
  if (entered === expected) renderAdminPanel();
}

async function renderAdminPanel() {
  const panel = document.getElementById('adminPanel');
  panel.innerHTML = `<div class="loading">טוען פניות…</div>`;
  let rows = [];
  try { rows = await sb('feedback', { select: '*', order: 'created_at.desc', limit: '50' }); } catch (e) {}

  panel.innerHTML = `
    <div class="field"><label>קוד ניהול (לשינוי)</label><input type="password" id="pinInput" placeholder="קוד חדש, 1-8 ספרות"></div>
    <button class="btn" id="savePinBtn" style="width:100%;margin-bottom:16px;">שמור קוד</button>
    <div class="field">
      <label>מפתח ניהול (service key) - לשינוי הודעת מערכת בלבד, נשמר רק להפעלה הנוכחית</label>
      <input type="password" id="adminKeyInput" placeholder="הדבק רק אם רוצים לפרסם הודעה">
    </div>
    <div class="field"><label>הודעת מערכת (יוצג לכולם בראש האתר)</label><textarea id="bannerText" placeholder="לדוגמה: תחזוקה הלילה בין 02:00-04:00"></textarea></div>
    <button class="btn" id="publishBannerBtn" style="width:100%;margin-bottom:8px;">פרסם הודעה</button>
    <button class="btn danger-outline" id="clearBannerBtn" style="width:100%;margin-bottom:20px;">הסר הודעה</button>
    <div class="section-title">פניות אחרונות (${rows.length})</div>
    ${rows.length ? rows.map(r => `<div class="feedback-row">${(r.message||'').replace(/</g,'&lt;')}<div class="meta">${new Date(r.created_at).toLocaleString('he-IL')}</div></div>`).join('') : '<div class="empty">אין עדיין פניות</div>'}
  `;
  document.getElementById('savePinBtn').onclick = () => {
    const v = document.getElementById('pinInput').value.trim();
    if (v.length >= 1 && v.length <= 8) { lsSet(LS.adminPin, v); alert('נשמר'); }
  };
  document.getElementById('publishBannerBtn').onclick = async () => {
    const key = document.getElementById('adminKeyInput').value.trim();
    const text = document.getElementById('bannerText').value.trim();
    if (!key || !text) return alert('צריך גם מפתח וגם טקסט');
    await publishBanner(text, key);
  };
  document.getElementById('clearBannerBtn').onclick = async () => {
    const key = document.getElementById('adminKeyInput').value.trim();
    if (!key) return alert('צריך מפתח ניהול כדי להסיר');
    await publishBanner('', key);
  };
}

async function publishBanner(text, serviceKey) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/site_banner?id=eq.1`, {
      method: 'PATCH',
      headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}`, 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify({ message: text, active: !!text }),
    });
    if (!res.ok) throw new Error(await res.text());
    checkSiteBanner();
    alert('עודכן');
  } catch (e) { alert('נכשל: ' + e.message); }
}

async function checkSiteBanner() {
  try {
    const rows = await sb('site_banner', { select: 'message,active', id: 'eq.1' });
    const banner = document.getElementById('siteBanner');
    if (rows[0]?.active && rows[0]?.message) { banner.textContent = rows[0].message; banner.classList.remove('hide'); }
    else banner.classList.add('hide');
  } catch {}
}

/* ======================= חיפוש + קטגוריות ======================= */
let searchDebounce;
document.getElementById('searchInput').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => searchProducts(e.target.value), 350);
});
const CATEGORIES = ['הכל', 'מוצרי חלב', 'פירות וירקות', 'בשר ודגים', 'ניקיון', 'בייבי', 'משקאות'];
const chipsHost = document.getElementById('categoryChips');
CATEGORIES.forEach((c, i) => {
  const chip = document.createElement('div');
  chip.className = 'chip' + (i === 0 ? ' active' : '');
  chip.textContent = c;
  chip.onclick = () => {
    chipsHost.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    chip.classList.add('active');
    searchProducts(i === 0 ? '' : c);
  };
  chipsHost.appendChild(chip);
});

loadInitial();
checkSiteBanner();
</script>
</body>
</html>
